<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#F4F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)">
<title>Coach Course & Swimrun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{color-scheme:light dark;
 --bg:#F4F2EE;--card:#fff;--field:#fff;--soft:#FBFAF7;--ink:#16181D;--inv:#fff;--mut:#6B6F76;--line:#E4E0D8;--chip:#EEEAE2;--chipt:#3b3b3b;
 --run:#E2552B;--swim:#1C7C93;--renfo:#7A5C9E;--race:#C99400;--ok:#2E8B57;--danger:#B3261E;--racebg:#FFFBEF;--offbg:#F6F5F2;--restbg:#F6F5F2;
 --i0:#3FA37A;--i1:#9BBF3B;--i2:#E9A92B;--i3:#EE7A2B;--i4:#D63B2B;--iw:#BFDCCB;--ir:#DAD5CB;
 --f-bg:#E6EEF6;--f-t:#2B5A85;--d-bg:#E9F3EA;--d-t:#2E6B3A;--s-bg:#FDEBE3;--s-t:#B2401C;--a-bg:#FFF4D6;--a-t:#8A6400;--r-bg:#EFEBF6;--r-t:#5B4682;
 --ev-irr-bg:#FBE4E1;--ev-irr:#8E1F12;--ev-amb-bg:#FFEBD9;--ev-amb:#8A3D00;--ev-att-bg:#E3F3E6;--ev-att:#1F6034;--ev-rea-bg:#E3EEF8;--ev-rea:#1E4C7A;--ev-low-bg:#EEEDEA;--ev-low:#45464a;
 --warn-bg:#FFEBD9;--warn:#7A3500;--code:#EEEAE2;--shadow:0 1px 2px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{
 --bg:#0E0F12;--card:#18191E;--field:#202228;--soft:#1D1F24;--ink:#F1F2F4;--inv:#0E0F12;--mut:#9AA0A8;--line:#2B2E35;--chip:#25282E;--chipt:#D7D9DD;
 --run:#FF6A3D;--swim:#3FB5CF;--renfo:#A98BD6;--race:#E8B730;--ok:#3DBB78;--danger:#FF6B5E;--racebg:#221E12;--offbg:#1A1B1F;--restbg:#1A1B1F;
 --i0:#33C48A;--i1:#A8D046;--i2:#F2B637;--i3:#FF8A3D;--i4:#FF4D3D;--iw:#2E5B47;--ir:#34373E;
 --f-bg:#16263A;--f-t:#8DB9E8;--d-bg:#15291B;--d-t:#86D49A;--s-bg:#35190F;--s-t:#FF9A73;--a-bg:#2E2610;--a-t:#F2C75C;--r-bg:#241C33;--r-t:#C2A9EC;
 --ev-irr-bg:#3A1714;--ev-irr:#FF9C91;--ev-amb-bg:#3A2412;--ev-amb:#FFB777;--ev-att-bg:#14301E;--ev-att:#86D49A;--ev-rea-bg:#14263A;--ev-rea:#8DB9E8;--ev-low-bg:#24262B;--ev-low:#C7CAD0;
 --warn-bg:#3A2412;--warn:#FFB777;--code:#2A2D33;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.2px}
button{font:inherit;cursor:pointer;color:inherit}input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:10px 14px 100px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px 4px;max-width:860px;margin:0 auto}
header.top h1{margin:0;font-size:20px;text-transform:uppercase;line-height:1;white-space:nowrap}
header.top h1 span{color:var(--run)}
.hrow{display:flex;align-items:center;gap:10px}
.sync{font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#bbb;display:inline-block;flex:none}.sync.cloud i{background:var(--ok)}
.who{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px 4px 5px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.who i{width:16px;height:16px;border-radius:50%;display:inline-block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 4px 12px;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:23px;height:23px}nav.tabs button.on{color:var(--ink);font-weight:600}nav.tabs button.on svg{color:var(--run)}
@media(min-width:900px){nav.tabs{position:sticky;top:0;bottom:auto;max-width:860px;margin:8px auto 0;border:1px solid var(--line);border-radius:12px}nav.tabs button{flex-direction:row;justify-content:center;font-size:14px;padding:10px}.wrap{padding-bottom:40px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.mut{color:var(--mut)}.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--chipt);white-space:nowrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--inv);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.5}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--ink)}
.iconbtn.sm{width:32px;height:32px;font-size:14px}
.monthbar{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
.monthbar h2{flex:1;text-align:center;margin:0;font-size:26px;text-transform:uppercase}
.ctx{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;margin-bottom:10px}
.vma{background:var(--ink);color:var(--inv);border-radius:12px;padding:10px 12px;text-align:center;border:0}
.vma b{font-family:"Barlow Condensed";font-size:28px;display:block;line-height:1}.vma small{font-size:11px;opacity:.75}
.week{margin:20px 0 8px}
.weekhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
.weekhead h3{margin:0 6px 0 0;font-size:19px;text-transform:uppercase}
.ph-Foncier{background:var(--f-bg);color:var(--f-t)}.ph-Développement{background:var(--d-bg);color:var(--d-t)}.ph-Spécifique{background:var(--s-bg);color:var(--s-t)}
.ph-Affûtage{background:var(--a-bg);color:var(--a-t)}.ph-Semaine{background:var(--ink);color:var(--inv)}.ph-Assimilation,.ph-Récupération,.ph-Reprise{background:var(--r-bg);color:var(--r-t)}
.day{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.dlabel{font-size:11.5px;color:var(--mut);text-transform:uppercase;font-weight:600;padding-top:4px}
.dlabel b{display:block;font-family:"Barlow Condensed";font-size:23px;color:var(--ink);line-height:1}
.day.today .dlabel b{color:var(--run)}.day.out{opacity:.55}
.sessions{display:flex;flex-direction:column;gap:6px;min-width:0}
.rest{font-size:13px;color:var(--mut);padding-top:7px}
/* lignes de séance + balayage */
.swipe{position:relative;border-radius:10px;overflow:hidden}
.swbg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(90deg,var(--ok) 50%,#6B6F76 50%)}
.srow{position:relative;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--run);border-radius:10px;padding:8px 8px 8px 10px;touch-action:pan-y;transition:transform .18s;cursor:pointer}
.srow.swim{border-left-color:var(--swim)}.srow.renfo{border-left-color:var(--renfo)}.srow.race{border-left-color:var(--race);background:var(--racebg)}.srow.off{border-left-color:var(--mut);background:var(--offbg)}
.srow.dragging{transition:none}
.srow .t{flex:1;min-width:0}.srow .t b{display:block;font-size:14.5px;font-weight:600;line-height:1.25}.srow .t span{font-size:12.5px;color:var(--mut)}
.srow.done .t{opacity:.55}.srow.done .t b{text-decoration:line-through;text-decoration-thickness:1.5px}
.tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--run)}
.swim .tag{color:var(--swim)}.renfo .tag{color:var(--renfo)}.race .tag{color:var(--race)}.off .tag{color:var(--mut)}
.chk{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;color:#fff}
.chk.on{background:var(--ok);border-color:var(--ok)}
/* schéma d'intensité */
.schema{display:flex;gap:1.5px;height:8px;margin-top:6px;border-radius:3px;overflow:hidden}
.schema.big{height:26px;gap:2px;border-radius:6px;margin-top:12px}
.schema i{display:block;min-width:2px;border-radius:1px}
.sg-w{background:var(--iw)}.sg-r{background:var(--ir)}.sg-i0{background:var(--i0)}.sg-i1{background:var(--i1)}.sg-i2{background:var(--i2)}.sg-i3{background:var(--i3)}.sg-i4{background:var(--i4)}
.schlab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:4px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:6px}.legend span{display:inline-flex;align-items:center;gap:4px}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
/* héros Aujourd'hui */
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero .kick{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--run)}
.hero h2{margin:2px 0 0;font-size:30px;line-height:1.05;text-transform:uppercase}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.kpi{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 11px;min-width:84px}
.kpi small{display:block;font-size:11px;color:var(--mut)}.kpi b{font-family:"Barlow Condensed";font-size:22px;line-height:1.1}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.acts button{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 4px;font-weight:600;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.acts button .ic{font-size:18px}.acts button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.sectitle{font-family:"Barlow Condensed";font-size:19px;text-transform:uppercase;margin:18px 2px 8px}
/* ruban semaine + jauge */
.ribbon{display:flex;gap:6px;align-items:flex-end}
.rd{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mut);font-weight:600}
.rd i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:block;position:relative}
.rd.today{color:var(--ink)}.rd.today i{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.rd i.ksw{background:var(--swim);border-color:var(--swim)}.rd i.krf{background:var(--renfo);border-color:var(--renfo)}.rd i.krc{background:var(--race);border-color:var(--race)}
.rd i.x0{background:var(--i0);border-color:var(--i0)}.rd i.x1{background:var(--i1);border-color:var(--i1)}.rd i.x2{background:var(--i2);border-color:var(--i2)}.rd i.x3{background:var(--i3);border-color:var(--i3)}.rd i.x4{background:var(--i4);border-color:var(--i4)}
.rd i.dn::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800}
.gauge{flex:1;min-width:120px}.gauge .tr{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}.gauge .fl{height:100%;border-radius:99px;background:var(--ink)}
.gauge .fl.hot{background:var(--i3)}.gauge .tr{position:relative;overflow:visible}.avgmark{position:absolute;top:-3px;width:2px;height:14px;background:var(--mut);border-radius:1px}.gauge small{display:block;font-size:11.5px;color:var(--mut);margin-top:3px}
.wsum{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
/* fiche plein écran */
.modal{position:fixed;inset:0;background:rgba(10,10,12,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 26px;-webkit-overflow-scrolling:touch}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.modal.full .sheet{max-height:100%;height:100%;border-radius:0;padding-top:max(14px,env(safe-area-inset-top))}
@media(min-width:700px){.modal.full .sheet{height:auto;max-height:92vh;border-radius:18px}}
.sheet h3{margin:0 0 6px;font-size:24px;text-transform:uppercase}
.fback{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.fback button{border:0;background:none;font-weight:600;font-size:15px;padding:6px 0;color:var(--ink)}
details.fd{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:10px}
details.fd summary{padding:12px 14px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.fd summary::-webkit-details-marker{display:none}details.fd summary::after{content:'+';color:var(--run)}details.fd[open] summary::after{content:'−'}
details.fd .in{padding:0 14px 12px;font-size:13.5px}
.fd h4,.sbody h4{margin:10px 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.fd ul{margin:0;padding-left:18px}.fd li{margin:2px 0}
li.ref{font-size:12px;color:var(--mut);list-style:none;margin-left:-18px}
.morelist{display:flex;flex-direction:column;gap:8px}
.morelist button{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink)}
.morelist button svg{width:24px;height:24px;color:var(--run);flex:none}.morelist b{display:block;font-size:15.5px}.morelist span{font-size:12.5px;color:var(--mut)}
.back{border:0;background:none;color:var(--run);font-weight:600;padding:4px 0;margin-bottom:2px}
/* existants */
.list{display:flex;flex-direction:column;gap:10px}
.race-card .name{font-family:"Barlow Condensed";font-size:22px;line-height:1.1}
.prio{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-family:"Barlow Condensed";font-size:18px;flex:none}
.prio.A{background:var(--run);color:#fff}.prio.B{background:#F2B79F;color:#6b2210}.prio.C{background:var(--chip);color:var(--chipt)}
.pred{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pred div{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px}
.pred small{display:block;color:var(--mut);font-size:11.5px}.pred b{font-family:"Barlow Condensed";font-size:20px}
.ev{margin-top:10px;border-radius:10px;padding:9px 11px;font-size:13.5px}.ev b{display:block}
.ev.irr{background:var(--ev-irr-bg);color:var(--ev-irr)}.ev.amb{background:var(--ev-amb-bg);color:var(--ev-amb)}.ev.att{background:var(--ev-att-bg);color:var(--ev-att)}.ev.rea{background:var(--ev-rea-bg);color:var(--ev-rea)}.ev.low{background:var(--ev-low-bg);color:var(--ev-low)}
.sec{margin-bottom:14px}.sec h3{margin:0 0 8px;font-size:20px;text-transform:uppercase}
label.f{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 4px;font-weight:500}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--field);font-size:15px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .big{font-family:"Barlow Condensed";font-size:44px;width:120px;text-align:center;border:0;background:none;padding:0;color:var(--ink)}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:none;padding:8px 4px;font-size:13.5px;color:var(--ink)}.seg button.on{background:var(--ink);color:var(--inv);font-weight:600}
.seg.g2{display:grid;grid-template-columns:1fr 1fr}.seg.g2 button{border-bottom:1px solid var(--line)}
.avail{display:grid;grid-template-columns:70px repeat(7,1fr);gap:4px;align-items:center;font-size:12px}
.avail .h{text-align:center;color:var(--mut);font-weight:600}
.avail button{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.avail button.on.run{background:var(--run);border-color:var(--run);color:#fff}.avail button.on.swim{background:var(--swim);border-color:var(--swim);color:#fff}.avail button.on.renfo{background:var(--renfo);border-color:var(--renfo);color:#fff}
table.z{width:100%;border-collapse:collapse;font-size:13px}table.z th,table.z td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}table.z th{font-size:11.5px;color:var(--mut);font-weight:600;text-transform:uppercase}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.sw{width:46px;height:28px;border-radius:999px;background:var(--chip);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--ok)}.sw.on::after{left:21px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--inv);padding:10px 14px;border-radius:10px;font-size:14px;z-index:60;display:none;max-width:90vw}
.empty{text-align:center;padding:26px 14px;color:var(--mut)}
.hint{font-size:12.5px;color:var(--mut);margin-top:6px}
.danger{color:var(--danger)}
.linkbtn{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;font-size:inherit}
.alt{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;border:1px solid var(--line);color:var(--ink)}.alt b{font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:6px}.pills button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13.5px;color:var(--ink)}.pills button.on{background:var(--ink);border-color:var(--ink);color:var(--inv);font-weight:600}
.dchips{display:flex;gap:4px;flex-wrap:wrap}.dchip{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;font-size:12.5px;min-width:40px;color:var(--ink)}.dchip.on{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.feel{display:flex;gap:4px;flex-wrap:wrap}.feel button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 9px;font-size:12.5px;color:var(--ink)}.feel button.on{background:var(--ok);border-color:var(--ok);color:#fff}.feel button.on.f4,.feel button.on.f5{background:#C0461F;border-color:#C0461F}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:11px 12px;margin-bottom:12px;font-size:13.5px}
.blk{display:flex;align-items:center;gap:10px}.blk .dot{width:10px;height:10px;border-radius:50%;flex:none}
.athcard{width:100%;text-align:left;border:1px solid var(--line);color:var(--ink)}.athcard.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.adot{width:38px;height:38px;border-radius:50%;color:#fff;display:grid;place-items:center;font-family:'Barlow Condensed';font-size:20px;font-weight:700;flex:none}

<body>
<header class="top"><div class="hrow"><h1>Coach <span>Course</span></h1><button id="who" class="who"></button></div><div id="sync" class="sync"><i></i><span>…</span></div></header>
<nav class="tabs" id="tabs"></nav>
<main class="wrap" id="main"></main>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script type="application/json" id="embedded-data">null</script>
<script>
/* ===== Moteur d'entraînement ===== */
const DAYS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const DSHORT = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

function pad2(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function wd(d){ return (d.getDay()+6)%7; }
function mondayOf(d){ return addDays(d,-wd(d)); }
function weeksBetween(a,b){ return Math.round((b-a)/(7*864e5)); }
function isoWeek(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); }

function defaultState(){
  return {
    profile:{ vma:13.5, fcmax:null, fcrepos:null, age:null, sex:'', swim100:null, css:null,
      avail:{ run:[1,3,5,6], swim:[0,2,4], renfo:[2,4] },
      maxRun:4, weekdayMax:60, prefs:{}, vmaMode:'alt1', mixWeek:false, lrDay:null, swimAllYear:false },
    races:[], done:{}, feel:{}, moves:{}, blocks:[], swaps:{}
  };
}

/* ---------- formats ---------- */
function v1(x){ return (Math.round(x*10)/10).toFixed(1).replace('.',','); }
function fmtSec(s){ s=Math.round(s); if(s<60) return s+'"'; const m=Math.floor(s/60), r=s%60; return r? m+"'"+pad2(r)+'"' : m+"'"; }
function fmtPaceSec(s){ s=Math.round(s); return Math.floor(s/60)+"'"+pad2(s%60); }
function fmtHMS(sec){ sec=Math.round(sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return h? h+'h'+pad2(m)+(s?"'"+pad2(s):'') : m+"'"+pad2(s); }
function fmtMin(m){ m=Math.round(m); return m<60? m+"'" : Math.floor(m/60)+'h'+(m%60?pad2(m%60):''); }
function parseHMS(str){
  if(!str) return null; str=String(str).trim().toLowerCase().replace(/\s/g,'');
  let m=str.match(/^(\d+)h(\d{1,2})?(?:[:'m](\d{1,2}))?/); if(m) return (+m[1])*3600+(+(m[2]||0))*60+(+(m[3]||0));
  const p=str.split(/[:']/).map(x=>x.replace(/[^\d]/g,'')).filter(x=>x!=='').map(Number);
  if(p.length===3) return p[0]*3600+p[1]*60+p[2];
  if(p.length===2) return p[0]*60+p[1];
  if(p.length===1 && p[0]>0) return p[0]*60;
  return null;
}

function makeEngine(S,H){ H=H||{};
  const P=S.profile;
  const kmh=pct=>P.vma*pct/100;
  const pace=v=>fmtPaceSec(3600/v)+'/km ‹'+v1(v)+' km/h›';
  const hrMax=()=>{ if(P.fcmax) return +P.fcmax; const a=+P.age||40; return Math.round(P.sex==='F'? 206-0.88*a : 208-0.7*a); };
  const hr=pct=>{ const mx=hrMax(), rs=+P.fcrepos||60; return Math.round(rs+pct/100*(mx-rs)); };
  const hrR=(lo,hi)=>'FC '+hr(lo)+'–'+hr(hi)+' bpm';
  const range=(lo,hi)=>fmtPaceSec(3600/kmh(lo))+'/km → '+fmtPaceSec(3600/kmh(hi))+'/km ‹'+v1(kmh(lo))+'–'+v1(kmh(hi))+' km/h›';
  const css=()=>{ if(P.css) return +P.css; if(P.swim100) return Math.round(+P.swim100*1.1); return 120; };
  const swP=d=>fmtPaceSec(css()+d)+'/100 m';

  /* ----- répétitions ----- */
  let COL=null;
  function parseRec(r){ if(!r) return null; let m=r.match(/(\d+)\s*m\b/); if(m) return ['dist',+m[1]]; m=r.match(/(\d+)'(\d+)?/); if(m) return ['time',(+m[1])*60+(+(m[2]||0))]; m=r.match(/(\d+)"/); if(m) return ['time',+m[1]]; return ['open',0]; }
  function wStep(o,pct){ return {p:'work',g:o.d?['dist',o.d]:['time',o.t],pace:3600/kmh(pct)}; }
  function toBlocks(list){ const B=[]; for(const e of list){ for(let i=0;i<e.k;i++){ const st=[wStep(e.o,e.pct)]; const rc=parseRec(e.rec); if(rc&&e.n>1) st.push({p:'rec',g:rc}); B.push({iter:e.n,steps:st}); if(e.R&&i<e.k-1) B.push({iter:1,steps:[{p:'rec',g:parseRec(e.R)}]}); } } return B; }
  function reps(n,o,pct,rec,mode){
    if(COL) COL.push({n,o,pct,rec,k:1,R:null});
    const v=kmh(pct); let t;
    if(o.d){ const sec=o.d/(v/3.6);
      t = mode==='piste' ? n+' × '+o.d+' m en '+fmtSec(sec)+' ('+pct+' % · '+pace(v)+')'
                         : n+' × '+fmtSec(sec)+' à '+pace(v)+' ≈ '+o.d+' m';
    } else { const dist=Math.round(v/3.6*o.t/10)*10;
      t = mode==='piste' ? n+' × '+fmtSec(o.t)+' : vise '+dist+' m ('+pct+' % · '+pace(v)+')'
                         : n+' × '+fmtSec(o.t)+' à '+pace(v)+' ≈ '+dist+' m';
    }
    if(o.t>=180 || (o.d && o.d/(v/3.6)>=180)) if(pct<=92) t+=' · '+hrR(pct-3,pct+1);
    return rec&&n>1? t+' — récup '+rec : t;
  }
  const ser=(k,inner,R)=>{ if(COL&&COL.length){ const e=COL[COL.length-1]; e.k=k; e.R=R; } return k+' séries de : '+inner+(R?' · '+R+' entre les séries':''); };

  let CAP=Infinity;
  const LVL=P.level==='debutant'?{f:0.75,lr:0.8,cyc:3}:P.level==='expert'?{f:1.2,lr:1.1,cyc:4}:{f:1,lr:1,cyc:null};
  const N_=n=>Math.max(1,Math.round(n*LVL.f));
  const tm=(d,pct)=>d/(kmh(pct)/3.6)/60;
  const WARM=(w=20)=>w+"' footing en EF (FC < "+hr(70)+' bpm) + gammes (montées de genoux, talons-fesses, pas chassés, foulées bondissantes : 2 × 30 m chacune) + 3 lignes droites progressives de 80 m';
  const WARM_HILL=(w=20)=>w+"' footing jusqu'à la côte (FC < "+hr(70)+' bpm) + gammes + 2 montées progressives de 20"';
  const COOL=(w=10)=>w+"' footing très lent (FC < "+hr(65)+' bpm) puis étirements doux';

  /* ----- bibliothèques (mm = durée du corps de séance, récup comprises) ----- */
  const VMAC=[
    m=>({t:'VMA courte · 100 m',l:[ser(2,reps(N_(6),{d:100},100,'100 m trot',m),"3'")],mm:2*6*(tm(100,100)+tm(100,60))+3}),
    m=>({t:'VMA courte · 30/30',l:[ser(2,reps(N_(8),{t:30},100,'30" trot',m),"3'")],mm:19}),
    m=>({t:'VMA courte · 200 m',l:[ser(2,reps(N_(4),{d:200},100,'45" trot',m),"3'")],mm:2*4*(tm(200,100)+0.75)+3}),
    m=>({t:'VMA courte · 45/30',l:[ser(3,reps(N_(5),{t:45},100,'30" trot',m),"2'30")],mm:24}),
    m=>({t:'VMA courte · 300 m',l:[ser(2,reps(N_(4),{d:300},97,'1\' trot',m),"3'")],mm:2*4*(tm(300,97)+1)+3}),
    m=>({t:'VMA courte · 1\'/45"',l:[ser(2,reps(N_(4),{t:60},100,'45" trot',m),"3'")],mm:17}),
    m=>({t:'VMA courte · pyramide',l:['200 – 300 – 400 – 300 – 200 m, récup = moitié du temps d\'effort en trot',
         reps(1,{d:200},100,'',m),reps(1,{d:300},97,'',m),reps(1,{d:400},95,'',m)],mm:tm(1400,98)*1.5,
         wk:[[200,100],[300,97],[400,95],[300,97],[200,100]].map(([d,p],i,a)=>({iter:1,steps:[{p:'work',g:['dist',d],pace:3600/kmh(p)}].concat(i<a.length-1?[{p:'rec',g:['time',Math.round(tm(d,p)*30)]}]:[])}))}),
  ];
  const VMAL=[
    m=>({t:'VMA longue · 400 m',l:[ser(2,reps(N_(3),{d:400},92,'200 m footing lent',m),"3'")],mm:2*3*(tm(400,92)+tm(200,60))+3}),
    m=>({t:'VMA longue · 500 m',l:[reps(N_(5),{d:500},90,"1'15",m)],mm:5*(tm(500,90)+1.25)}),
    m=>({t:'VMA longue · 2\'/1\'',l:[ser(2,reps(N_(4),{t:120},92,"1' trot",m),"3'")],mm:27}),
    m=>({t:'VMA longue · 800 m',l:[reps(N_(4),{d:800},90,"2' trot",m)],mm:4*(tm(800,90)+2)}),
    m=>({t:'VMA longue · 3\'',l:[reps(N_(5),{t:180},90,"1'30 trot",m)],mm:22.5}),
    m=>({t:'VMA longue · 1000 m',l:[reps(N_(3),{d:1000},90,"2'30 trot",m)],mm:3*(tm(1000,90)+2.5)}),
  ];
  const SEUIL=[
    m=>({t:'Seuil · '+N_(3)+' × 4\'',l:[reps(N_(3),{t:240},85,"2' trot",m)],mm:16}),
    m=>({t:'Seuil · '+N_(4)+' × 4\'',l:[reps(N_(4),{t:240},85,"1'30 trot",m)],mm:20.5}),
    m=>({t:'Seuil · '+N_(3)+' × 6\'',l:[reps(N_(3),{t:360},85,"2' trot",m)],mm:22}),
    m=>({t:'Seuil · '+N_(2)+' × 8\'',l:[reps(N_(2),{t:480},85,"2'30 trot",m)],mm:18.5}),
    m=>({t:'Seuil · '+N_(3)+' × 1200 m',l:[reps(N_(3),{d:1200},85,"2' trot",m)],mm:3*tm(1200,85)+4}),
    m=>({t:'Seuil · '+N_(2)+' × 10\'',l:[reps(N_(2),{t:600},85,"3' trot",m)],mm:23}),
  ];
  const COTES=[
    ()=>({wk:[{iter:N_(8),steps:[{p:'work',g:['time',45]},{p:'rec',g:['open',0]}]}],mm:18,t:'Côtes courtes',l:[N_(8)+' × 45" en côte (6–10 %) à intensité VMA, récup = redescente en trot','Buste droit, bras actifs, pose avant-pied'],dur:50}),
    ()=>({wk:[{iter:N_(4),steps:[{p:'work',g:['time',180],hr:[hr(84),hr(88)]},{p:'rec',g:['open',0]}]}],mm:24,t:'Côtes longues',l:[N_(4)+" × 3' en côte"+" à intensité seuil ("+hrR(84,88)+'), récup = redescente en trot','Si pente > 15 % : marche active, mains sur les cuisses'],dur:60}),
    ()=>({wk:[{iter:N_(5),steps:[{p:'work',g:['time',90]},{p:'rec',g:['open',0]}]}],mm:16,t:'Côtes + descentes',l:[N_(5)+" × 1'30 montée"+" soutenue + descente rapide relâchée (pieds légers, regard loin)",'Travaille la cadence en descente : petits pas rapides'],dur:55}),
    ()=>({wk:[{iter:N_(2),steps:[{p:'work',g:['time',480],hr:[hr(84),hr(88)]},{p:'rec',g:['open',0]}]}],mm:24,t:'Côtes longues seuil',l:[N_(2)+" × 8' en montée"+" à intensité seuil ("+hrR(84,88)+'), récup redescente','Alterne course et marche active selon la pente, sans dépasser la FC cible'],dur:65}),
  ];

  /* ----- swimrun : Big Run / Big Swim ----- */
  function bigs(r){ if(!r||r.type!=='swimrun') return null; const seg=+r.swimSeg||Math.max(1,Math.round((+r.swimKm||1)/0.6));
    const br=+r.bigRun||Math.round((+r.km||0)/(seg+1)*10)/10, bs=+r.bigSwim||Math.round((+r.swimKm||0)*1000/seg/50)*50; return {br,bs,set:!!(+r.bigRun&&+r.bigSwim)}; }
  function prog(c){ const s=c.sw!=null?c.sw:c.w; if(s==null) return 0.6; if(s>8) return 0.5; if(s>=3) return Math.min(1,0.7+(8-s)*0.06); return 0.8; }
  const r50=x=>Math.max(100,Math.round(x/50)*50), rk=x=>Math.max(1,Math.round(x*2)/2), kmS=x=>String(x).replace('.',',')+' km';

  /* ----- prédiction ----- */
  function frac(tMin){ return tMin<=6?1:Math.max(0.55,1-0.06*Math.log(tMin/6)); }
  function predict(r,vma){
    vma=vma||P.vma; const T={roulant:1.0,technique:1.08};
    if(r.type==='swimrun'){
      const sw=(+r.swimKm||0)*10*css()*1.12, seg=+r.swimSeg||Math.max(1,Math.round((+r.swimKm||1)/0.6));
      const runEff=(+r.km||0)+(+r.dplus||0)/100; let t=3600;
      for(let i=0;i<30;i++){ const v=vma*frac(t/60)*0.95/1.08; t=sw+runEff/v*3600+seg*60; }
      return t;
    }
    const eff=(+r.km||0)+(r.type==='nature'?(+r.dplus||0)/100:0);
    const tf=r.type==='nature'?(T[r.terrain]||1.04):1;
    let t=eff/(vma*0.85)*3600;
    for(let i=0;i<30;i++){ const v=vma*frac(t/60)*(r.type==='nature'?0.95:1); t=eff/v*3600*tf; }
    return t;
  }
  function evalSolo(r,today){
    const now=today||new Date(); const w=Math.max(0,weeksBetween(mondayOf(now),mondayOf(parseD(r.date))));
    return {w,pNow:predict(r),pDay:predict(r,P.vma*(1+0.003*Math.min(w,12)))};
  }
  function evaluate(r,today){
    const a=evalSolo(r,today); let pNow=a.pNow, pDay=a.pDay, w=a.w, slower=null, duo=null;
    if(r.duo&&r.type==='swimrun'&&H.partnerEval){ const b=H.partnerEval(r,today); if(b){ duo=b.name; if(b.pDay>pDay) slower=b.name; pNow=Math.max(pNow,b.pNow); pDay=Math.max(pDay,b.pDay); } }
    const goal=parseHMS(r.goal); let ev=null;
    if(goal){ const q=goal/pDay;
      ev = q<0.95?{k:'irr',l:'Irréaliste pour l\'instant',c:'Ton objectif demande un gain de VMA d\'environ '+Math.round((pDay/goal-1)*100)+' %. Vise d\'abord '+fmtHMS(pDay*0.97)+'.'}
        : q<0.985?{k:'amb',l:'Ambitieux',c:'Faisable si la préparation est suivie sans accroc et que la course se passe bien.'}
        : q<1.015?{k:'att',l:'Atteignable',c:'Bien calibré : c\'est ce que ta VMA permet le jour J avec l\'entraînement prévu.'}
        : q<1.05 ?{k:'rea',l:'Réaliste',c:'Sûr d\'être atteint. Tu peux viser un peu plus vite.'}
        :         {k:'low',l:'Pas assez ambitieux',c:'Tu as de la marge : vise plutôt '+fmtHMS(pDay*0.99)+'.'};
    }
    return {pNow,pDay,pSelf:a.pDay,w,goal,ev,duo,slower,suggestAmb:pDay*0.97,suggestReal:pDay*1.01};
  }
  function raceDur(r){ return predict(r); }
  function raceSpeed(r){ const ev=evaluate(r);
    if(r.type==='swimrun'){ const t=(ev.goal&&ev.goal>=ev.pDay*0.95)?ev.goal:ev.pDay; return P.vma*(1+0.003*Math.min(ev.w,12))*frac(ev.pSelf/60)*0.95/1.08*(ev.pSelf/t); } const t=(ev.goal && ev.goal>=ev.pDay*0.95)?ev.goal:ev.pDay; const eff=(+r.km||0); return eff/(t/3600); }

  /* ----- contexte de semaine ----- */
  const races=()=>[...S.races].filter(r=>r.date).sort((a,b)=>a.date<b.date?-1:1);
  function weekCtx(ws){
    const we=addDays(ws,6), R=races();
    const inWeek=R.filter(r=>{const d=parseD(r.date);return d>=ws&&d<=we;});
    let target=R.find(r=>r.prio==='A'&&parseD(r.date)>=ws&&weeksBetween(ws,mondayOf(parseD(r.date)))<=20)
            || R.find(r=>r.prio==='B'&&parseD(r.date)>=ws&&weeksBetween(ws,mondayOf(parseD(r.date)))<=12) || null;
    const w=target?weeksBetween(ws,mondayOf(parseD(target.date))):null;
    const aNext=R.find(r=>r.prio==='A'&&parseD(r.date)>=ws)||null, wA=aNext?weeksBetween(ws,mondayOf(parseD(aNext.date))):null;
    const cyc=LVL.cyc||((+P.age>=50)?3:4);
    let phase;
    // récupération après une course majeure
    const recent=R.find(r=>{ if(r.prio==='C') return false; const d=parseD(r.date); const long=raceDur(r)>9000;
      const lim=long&&r.prio==='A'?14:7; return d<ws && (ws-d)/864e5<=lim && (r.prio==='A'||raceDur(r)>9000); });
    const long=target&&raceDur(target)>7200;

    if(reprise && !(target&&w===0)) phase='Reprise';

  function vmaMode(ws){ const m=P.vmaMode; if(m==='piste'||m==='route') return m; const k=Math.round((ws-new Date(2024,0,1))/(7*864e5)); const a=m==='alt2'?Math.floor(k/2)%2:k%2; return a?'route':'piste'; }

  /* ----- placement des jours ----- */

  function lrNominal(c){ // durée de la sortie longue hors allègement

  function footing(dur,plus){ dur=Math.min(dur,CAP); return {cat:'run',type:'Footing',title:'Footing '+dur+"'",sum:dur+"' · "+hrR(65,75),dur,wk:{warm:false,blocks:[{iter:1,steps:[{p:'work',g:['time',dur*60],hr:[hr(65),hr(75)]}]}]},

  function quality(kind,c,idx){

    const terrain= hill?'Côte de 150–400 m' : (m==='piste'?'Sur piste (400 m)':'Sur route/chemin plat, montre GPS en mode intervalles');

    cotesSeuil:{l:'Côtes longues au seuil',why:'Même intensité, mais en montée : moins monotone et plus doux pour les articulations.',make:c=>quality('COTES',c,3)},
    courtes:{l:'Fractions courtes au seuil',why:'Des blocs de 2\' : le temps passe plus vite, pour le même travail.',make:c=>{ COL=[]; const t=reps(N_(8),{t:120},87,'45" trot',c.mode); const b=toBlocks(COL); COL=null; return customQ('Seuil','Seuil en fractions courtes · '+N_(8)+' × 2\'',c.mode==='piste'?'Sur piste (400 m)':'Sur route/chemin plat',[t],22,b); }},
    cotesC:{l:'Côtes courtes',why:'La VMA en montée : même effort, moins de chocs.',make:c=>quality('COTES',c,0)},
    fartV:{l:'Fartlek vitesse',why:'10 accélérations au feeling, sans chrono ni piste.',make:c=>customQ('VMA courte','Fartlek vitesse · 10 × 1\'','Au feeling, n\'importe où',["10 × (1' vite + 1' souple)",'Partie vite : proche de ton allure VMA ('+pace(kmh(98))+'), sans regarder la montre','Récup en trottinant, jamais à l\'arrêt'],20,[{iter:10,steps:[{p:'work',g:['time',60]},{p:'rec',g:['time',60]}]}])},
    cotesL:{l:'Côtes longues',why:'Travail long à haute intensité, en montée.',make:c=>quality('COTES',c,1)},
    fartL:{l:'Fartlek long',why:'Des blocs de 3\' vite au feeling, sur chemin.',make:c=>customQ('VMA longue','Fartlek long · 5 × 3\'','Au feeling, sur chemin',["5 × (3' vite + 2' souple)",'Partie vite : '+pace(kmh(92))+', sensation « très soutenu »','Récup en trottinant'],25,[{iter:5,steps:[{p:'work',g:['time',180],pace:3600/kmh(92)},{p:'rec',g:['time',120]}]}])},
    plat:{l:'Seuil sur le plat',why:'Pas de côte sous la main ? Le même travail sur terrain plat.',make:c=>quality('SEUIL',c,2)},
    specFart:{l:'Fartlek allure course',why:'Des blocs à l\'allure de course entrecoupés de souple, plus ludique.',make:c=>{ const v=c.target?raceSpeed(c.target):kmh(85); return customQ('Allure spécifique','Fartlek allure course · 5 × 4\'',pace(v),["5 × (4' à allure course + 1' souple)",'Allure cible : '+pace(v)],25,[{iter:5,steps:[{p:'work',g:['time',240],pace:3600/v},{p:'rec',g:['time',60]}]}]); }},
    specBloc:{l:'Bloc continu',why:'Un seul bloc à allure course : la sensation de course, sans fractionner.',make:c=>{ const v=c.target?raceSpeed(c.target):kmh(85); return customQ('Allure spécifique',"Allure course · bloc de 20'",pace(v),["20' continu à allure course : "+pace(v),'Régularité avant tout : même allure au début et à la fin'],20,[{iter:1,steps:[{p:'work',g:['time',1200],pace:3600/v}]}]); }},
    velo:{l:'Vélo / VTT',why:'Même endurance, zéro impact : idéal si les jambes sont lourdes.',make:(c,s)=>{ const d=Math.round(s.dur*1.3/5)*5; return {cat:'run',type:'Vélo',title:'Vélo / VTT '+fmtMin(d),sum:'Endurance sans impact',dur:d,blocks:[{h:'Séance',l:[fmtMin(d)+' en endurance : '+hrR(58,70)+' (la FC à vélo est environ 10 bpm plus basse qu\'en course)','Moulinette souple, pas de bosses en force']}]}; }},
    marche:{l:'Marche nordique / rando',why:'Récupération active, avec du D+ si tu veux.',make:(c,s)=>{ const d=Math.round(s.dur*1.3/5)*5; return {cat:'run',type:'Marche',title:'Marche nordique / rando '+fmtMin(d),sum:'Récupération active',dur:d,blocks:[{h:'Séance',l:[fmtMin(d)+' de marche active, bâtons si possible : '+hrR(50,65),'En terrain vallonné, monte à bon rythme et redescends tranquillement']}]}; }},
    nageSouple:{l:'Natation souple',why:'Récupère en travaillant le haut du corps.',make:()=>({cat:'swim',type:'Piscine',title:'Natation souple 30\'',sum:'~1 300 m souple',dur:30,blocks:[{h:'Séance',l:['300 m souple crawl/dos','4 × 200 m pull-buoy à '+swP(12)+' — r 20"','200 m souple']}]})},
    randoCourse:{l:'Rando-course',why:'Alterner course et marche : même durée d\'effort, moins de fatigue.',make:(c,s)=>{ const d=Math.round(s.dur*1.2/5)*5; return {cat:'run',type:'Sortie longue',title:'Rando-course '+fmtMin(d),sum:'Course + marche, '+hrR(60,75),dur:d,wk:{warm:false,blocks:[{iter:1,steps:[{p:'work',g:['time',d*60],hr:[hr(60),hr(75)]}]}]},blocks:[{h:'Séance',l:[fmtMin(d)+' en alternant 10\' de course et 2\' de marche active',hrR(60,75)+', terrain vallonné bienvenu','Marche dans les montées raides']}]}; }},
    veloLong:{l:'Vélo long',why:'Endurance longue sans impact.',make:(c,s)=>{ const d=Math.min(210,Math.round(s.dur*1.6/5)*5); return {cat:'run',type:'Vélo',title:'Sortie vélo '+fmtMin(d),sum:'Endurance sans impact',dur:d,blocks:[{h:'Séance',l:[fmtMin(d)+' en endurance : '+hrR(58,70),'Emporte à boire et à manger']}]}; }},
    report:{l:'Reporter le test',why:'Pas en forme pour un test ? Un footing à la place, test la semaine prochaine.',make:()=>footing(40,'+ 4 lignes droites de 80 m. Refais le test VMA la semaine prochaine')},
  };
  const PREFS={'Seuil':['fartlek','tempo','cotesSeuil','courtes'],'VMA courte':['cotesC','fartV'],'VMA longue':['cotesL','fartL'],'Côtes':['plat','fartlek']};
  function altsFor(s,c,iw,cap){
    if(s.noAlt||s.cat==='race'||s.cat==='off') return null;
    const mk=id=>({id,l:ALT[id].l,why:ALT[id].why,make:()=>withCap(cap,()=>ALT[id].make(c,s))});
    const variant=(id,l,why,f)=>({id,l,why,make:()=>withCap(cap,f)});
    const ids={'Seuil':['fartlek','tempo','cotesSeuil','courtes'],'VMA courte':['cotesC','fartV'],'VMA longue':['cotesL','fartL'],'Côtes':['plat','fartlek'],
      'Allure spécifique':['specFart','specBloc'],'Spécifique swimrun':['specFart','fartlek'],'Footing':['velo','marche','nageSouple'],'Sortie longue':['randoCourse','veloLong'],'Test VMA':['report']}[s.type];
    let L=(ids||[]).filter(id=>!(s.type==='Seuil'&&id==='cotesSeuil'&&false)).map(mk);
    if(s.type==='VMA courte') L.unshift(variant('autre','Autre format de VMA courte','Même objectif, autres répétitions.',()=>quality('VMAC',c,iw+3)));
    if(s.type==='VMA longue') L.unshift(variant('autre','Autre format de VMA longue','Même objectif, autres répétitions.',()=>quality('VMAL',c,iw+2)));
    if(s.type==='Côtes') L.unshift(variant('autre','Autre séance de côtes','Même objectif, autre format.',()=>quality('COTES',c,iw+1)));
    if(s.type==='Piscine'&&s._li!=null){ const nm=['Technique & endurance','Seuil CSS','Spécifique swimrun','Endurance longue','Vitesse & relances'], why=['Plus de technique, intensité modérée','Travail au seuil (CSS)','Pull-buoy, plaquettes et visée','Volume en endurance','Vitesse et départs'];
      L=[0,1,2,3,4].filter(i=>i!==s._li).map(i=>variant('pool'+i,'Piscine · '+nm[i],why[i],()=>swimPool(c,0,s._ph||'base',i))); }
    if(s.type==='Eau libre'&&s._oi!=null){ L=[0,1,2].filter(i=>i!==s._oi).map(i=>variant('ow'+i,['Eau libre · repères','Eau libre · enchaînements','Eau libre · continu'][i],'Autre séance en eau libre',()=>swimOW(c,i))).concat([variant('pool2','Piscine · Spécifique swimrun','Si l\'eau libre n\'est pas possible',()=>swimPool(c,0,'spe',2))]); }
    if(s.type==='Renfo'&&s._rk){ L=Object.keys(RENFO).filter(k=>k!==s._rk).map(k=>variant('renfo'+k,RENFO[k].t,k==='R4'?'Plus doux : mobilité et récupération':'Autre circuit de renforcement',()=>renfo(c,0,k))); }
    return L.length?L:null;
  }

  /* ----- course (jour J) ----- */
  function raceSession(r){
    const ev=evaluate(r); const t=(ev.goal&&ev.goal>=ev.pDay*0.95)?ev.goal:ev.pDay; const l=[];
    const desc=(r.type==='swimrun'?(r.km||0)+' km course + '+(r.swimKm||0)+' km nage':(r.km||0)+' km')+(+r.dplus?' · '+r.dplus+' m D+':'');
    l.push(desc); l.push('Temps visé : '+fmtHMS(t)+(ev.goal?'':' (prévision)'));
    if(r.type==='route'){ const v=(+r.km)/(t/3600); l.push('Allure : '+pace(v)+'. Pars 2–3 s/km plus lent les 2 premiers km'); }
    if(r.type==='nature') l.push('Gère à la FC en montée (sous '+hr(88)+' bpm au début), relance sur le plat et en descente');
    if(r.type==='swimrun') l.push('Nage ~'+swP(10)+', course à la sensation, transitions rapides');
    l.push(t<3600*1.2?"Échauffement : 15' footing + gammes + 3 accélérations":"Échauffement : 10' footing léger, le début de course sert d'échauffement");
    return {cat:'race',type:'Course',title:'🏁 '+r.name,sum:desc+' · priorité '+r.prio,dur:Math.round(t/60),blocks:[{h:'Jour de course',l}]};
  }

  /* ----- semaine ----- */
  function buildWeek(ws){
    let c=weekCtx(ws); const C0=c, Av=P.avail, maxR=Math.max(1,+P.maxRun||4);
    const iw=isoWeek(ws), out={}; for(let i=0;i<7;i++) out[i]=[];
    const ph=c.phase;
    let N={'Foncier':3,'Développement':4,'Spécifique':4,'Affûtage':3,'Semaine de course':3,'Assimilation':2,'Récupération':2,'Reprise':3}[ph];
    if(ph==='Spécifique'&&(c.kind==='marathon'||c.kind==='nature')&&maxR>=5) N=5;
    if(ph==='Foncier'&&maxR>=5) N=4;
    if(P.level==='debutant') N=Math.min(N,3);
    if(P.level==='expert'&&(ph==='Développement'||ph==='Spécifique')) N+=1;
    N=Math.min(N,maxR,new Set(Av.run.concat(P.lrDay!=null?[+P.lrDay]:[])).size);
    let roles;
    switch(ph){
      case 'Foncier': roles=['LR','Q1','Q2','E','E']; break;
      case 'Développement': roles=['LR','Q1','Q2','E','E']; break;
      case 'Spécifique': roles=['LR','Q1','Q2','E','E']; break;
      case 'Affûtage': roles=['LR','Q1','E','E']; break;
      case 'Assimilation': roles=['LR','E+','E']; break;
      case 'Récupération': roles=['E','E']; break;
      case 'Reprise': roles=['R','R','E']; break;
      default: roles=['Q1','E','E'];
    }
    roles=roles.slice(0,N);
    const raceDays=c.inWeek.map(r=>({r,d:wd(parseD(r.date))}));
    const runAv=[...new Set(Av.run.concat(P.lrDay!=null&&roles.includes('LR')?[+P.lrDay]:[]))];
    let runMap=place(runAv,roles);
    { const q1=Object.keys(runMap).find(k=>runMap[k]==='Q1'), q2=Object.keys(runMap).find(k=>runMap[k]==='Q2'); if(q1&&q2&&+q2<+q1){ runMap[q1]='Q2'; runMap[q2]='Q1'; } }
    // ajustements semaine de course
    if(raceDays.length){
      for(const {r,d} of raceDays){
        for(const k of Object.keys(runMap)){ const day=+k;
          if(day===d||day===d-1) delete runMap[k];
          else if(r.prio!=='C'&&day>d) runMap[k]='E-';
          else if(r.prio==='A'||r.prio==='B'){ if(runMap[k]==='LR'||runMap[k]==='Q2') delete runMap[k]; if(runMap[k]==='Q1'&&d-day<3) runMap[k]='E'; }
          else if(runMap[k]==='Q1') delete runMap[k];
        }
        if(r.prio!=='C'){
          if(d>=2&&Av.run.includes(d-2)) runMap[d-2]='PRE';
          else { const before=Object.keys(runMap).map(Number).filter(x=>x<d-1&&runMap[x][0]!=='Q').sort((a,b)=>b-a); if(before.length) runMap[before[0]]='PRE'; }
        }
      }
    }
    const isTest=(ph==='Foncier'&&!c.target&&iw%8===0)||(c.target&&c.w===12);
    const qRaw={};
    for(const [k,role] of Object.entries(runMap)){
      const d=+k; let s; CAP=(d<=4&&+P.weekdayMax)?+P.weekdayMax:Infinity;
      if(role==='LR') s=longRun(c);
      else if(role==='Q1'){
        if(isTest) s=vmaTest(c);
        else if(ph==='Spécifique') s=specific(c,iw);
        else if(ph==='Affûtage') s=c.kind==='nature'?quality('VMAC',c,iw):specific(c,iw);
        else if(ph==='Semaine de course'||raceDays.length) { s=quality('VMAC',c,iw); s.noAlt=true; s.title='Rappel de vitesse'; if(s.wk) s.wk.blocks=s.wk.blocks.slice(0,1); s.blocks[1].l=['Version allégée : '+s.blocks[1].l[0].replace(/^\d séries de : /,'1 série de : ')]; s.dur=40; }
        else if(ph==='Développement') s=quality(c.kind==='marathon'||c.kind==='semi'?'VMAL':(iw%2?'VMAC':'VMAL'),c,Math.floor(iw/2));
        else s=quality('VMAC',c,iw);
      }
      else if(role==='Q2'&&P.level==='debutant'&&(ph==='Foncier'||ph==='Assimilation')){ s=footing(40,'+ 5 lignes droites de 80 m en fin de footing (accélérations progressives, pas un sprint)'); }
      else if(role==='Q2'){ const c0=c; c=P.mixWeek?{...c,mode:c.mode==='piste'?'route':'piste'}:c;
        if(ph==='Spécifique') s=c.kind==='nature'?quality('SEUIL',c,iw):(c.kind==='10k'?quality('VMAL',c,iw):quality('SEUIL',c,iw));
        else if(ph==='Développement') s=(c.kind==='nature'&&iw%2===0)?quality('COTES',c,iw):quality('SEUIL',c,Math.max(1,12-c.w));
        else s=(c.kind==='nature'||(c.target&&+c.target.dplus>300))&&iw%2? quality('COTES',c,iw) : (iw%2?quality('VMAL',c,Math.floor(iw/2)%3):quality('SEUIL',c,Math.floor(iw/2)%3));
      }
      else if(role==='R') s=footing(30,'Reprise : 30\' très souple. Arrête si la douleur ou la fatigue revient');
      else if(role==='E+') s=footing(40,'Fartlek libre : 6 × 30" un peu plus vite, au feeling');
      else if(role==='E-') s=footing(30,'Footing de récupération, très souple');
      else if(role==='PRE') s=footing(20,'+ 3 accélérations progressives de 80 m. Veille de course : repos');
      else s=footing(ph==='Récupération'||ph==='Reprise'?35:ph==='Affûtage'?35:ph==='Foncier'?Math.round((40+10*foncierProg(c))/5)*5:45, ph==='Foncier'?'+ 4 lignes droites de 80 m en fin de footing':null);
      // séances club communes : on note la séance « brute » puis on aligne sur le thème du club
      const flex=(role==='Q1'||role==='Q2')&&s.qk&&!isTest&&!raceDays.length&&(ph==='Foncier'||ph==='Développement');
      if(s.qk) qRaw[d]={k:s.qk,m:s.qm,flex};
      if(flex&&H.club){ const T=(H.club(ws)||{})[d]; if(T&&T.k){ const n=quality(T.k,{...c,mode:T.m},T.i); if(n){ s=n; s.club=T.with||[];
        const w=s.club.length?s.club.join(', '):'le groupe'; s.sum=s.sum+' · Séance club avec '+w;
        s.blocks.unshift({h:'Séance club',l:['Même séance que '+w+' : chacun à ses allures et à son nombre de répétitions']}); } } }
      if(role==='PRE'||role==='E-'||role==='R') s.noAlt=true; s.alts=altsFor(s,c,iw,CAP); out[d].push(s); c=C0;
    }
    CAP=Infinity;
    for(const {r,d} of raceDays) out[d].unshift(raceSession(r));
    // natation
    if(c.swimT||P.swimAllYear){
      let nS, sph;
      if(!c.swimT){ nS=1; sph='base'; }
      else if(c.sw===0){ nS=1; sph='race'; }
      else if(c.sw<=2){ nS=2; sph='taper'; }
      else if(c.sw<=8){ nS=2; sph='spe'; }
      else if(c.sw<=12){ nS=2; sph='dev'; }
      else { nS=1; sph='base'; }
      if(ph==='Récupération') nS=1;
      const blocked=new Set(); raceDays.forEach(({d})=>{blocked.add(d);blocked.add(d-1);});
      const qDays=Object.entries(runMap).filter(([k,v])=>v==='Q1'||v==='Q2').map(([k])=>+k);
      const ow = c.swimT && c.sw>=1 && c.sw<=8;
      const brick=c.swimT&&c.sw>=9&&c.sw<=14&&iw%2===0&&ph!=='Récupération'&&ph!=='Reprise';
      const pDays=(ow||brick)&&c.swimT.duo&&H.partnerSwim?H.partnerSwim(c.swimT):null; // binôme : mêmes jours si possible
      let cand=P.avail.swim.filter(d=>!blocked.has(d)).sort((a,b)=>{ const sc=x=>(pDays&&!pDays.includes(x)?4:0)+(qDays.includes(x)?2:0)+(runMap[x]==='LR'?1:0); return sc(a)-sc(b)||a-b; });
      const chosen=[]; for(const d of cand){ if(chosen.length>=nS) break; if(chosen.every(x=>cd(x,d)>=2)||cand.length<=nS) chosen.push(d); }
      for(const d of cand){ if(chosen.length>=nS) break; if(!chosen.includes(d)) chosen.push(d); }
      chosen.sort((a,b)=>a-b);
      chosen.forEach((d,i)=>{ let s;
        if(brick&&i===0){ s=swimBrick(c); s.alts=null; out[d].push(s); return; }
        if(ow && i===chosen.length-1 && chosen.length>1) s=swimOW(c,iw);
        else if(ow && chosen.length===1 && iw%2) s=swimOW(c,iw);
        else s=swimPool(c,iw*2+i,sph==='race'?'race':sph==='taper'?'taper':sph==='spe'?'spe':sph);
        s.alts=altsFor(s,c,iw,Infinity); out[d].push(s); });
    }
    // renfo
    { let nR={'Foncier':2,'Développement':1,'Spécifique':1,'Affûtage':0,'Semaine de course':0,'Assimilation':1,'Récupération':1,'Reprise':1}[ph];
      const blocked=new Set(); raceDays.forEach(({d})=>{blocked.add(d);blocked.add(d-1);blocked.add(d-2);});
      const nextQ=new Set(Object.entries(runMap).filter(([k,v])=>v[0]==='Q'||v==='LR').map(([k])=>+k-1));
      const cand=P.avail.renfo.filter(d=>!blocked.has(d)).sort((a,b)=>{const sc=x=>(nextQ.has(x)?2:0)+(out[x].length?1:0);return sc(a)-sc(b)||a-b;});
      cand.slice(0,nR).forEach((d,i)=>{ const s=renfo(c,iw+i); s.alts=altsFor(s,c,iw,Infinity); out[d].push(s); });
    }
    // périodes bloquées
    const BL=(S.blocks||[]).filter(b=>b.from&&b.to);
    for(let i=0;i<7;i++){ const dk=ymd(addDays(ws,i)); const b=BL.find(b=>b.from<=dk&&b.to>=dk&&b.kind!=='allege'); if(!b) continue;
      const keepRace=out[i].filter(s=>s.cat==='race');
      if(b.kind==='blessure'||b.kind==='maladie'){
        out[i]=keepRace.concat([{cat:'off',type:'Pause',title:'Pause · '+(b.kind==='blessure'?'blessure':'maladie'),sum:b.note||'',dur:0,
          blocks:[{h:'Conseil',l:b.kind==='blessure'?['Pas de course tant que la douleur est là','Si un avis médical l\'autorise : vélo, natation souple ou renfo du haut du corps']:['Repos complet tant qu\'il y a de la fièvre','Reprise ensuite par des footings courts en EF']}]}]);
      } else if(b.kind==='vacances'){
        out[i]=out[i].filter(s=>s.cat==='race'||s.cat==='renfo'||s.type==='Eau libre').map(s=>s).concat(out[i].some(s=>s.cat==='run')?[Object.assign(footing(40,'Vacances : si l\'occasion se présente, sans contrainte'),{title:'Footing libre 40\''})]:[]);
      }
    }
    // clés + déplacements
    for(let i=0;i<7;i++){ const dk=ymd(addDays(ws,i)); out[i].forEach(s=>{ s.key=dk+'|'+s.title; s.orig=dk; }); }
    const SW=S.swaps||{}, PR=P.prefs||{};
    for(let i=0;i<7;i++){ out[i]=out[i].map(s=>{ if(!s.alts) return s; const want=SW[s.key]||(PR[s.type]&&!SW[s.key]?PR[s.type]:null); if(!want||want==='keep') return s;
      const a=s.alts.find(x=>x.id===want); if(!a) return s; const n=a.make(); n.key=s.key; n.orig=s.orig; n.alts=s.alts; n.swapped={from:s.title,fromType:s.type,id:a.id,auto:!SW[s.key]}; return n; }); }
    const moved=[];
    for(let i=0;i<7;i++){ out[i]=out[i].filter(s=>{ const t=(S.moves||{})[s.key]; if(t&&t!==s.orig){ const j=Math.round((parseD(t)-ws)/864e5); if(j>=0&&j<7){ s.moved=true; moved.push([j,s]); return false; } } return true; }); }
    moved.forEach(([j,s])=>out[j].push(s));
    return {ctx:c,days:out,qRaw};
  }

  return {ALTL:Object.fromEntries(Object.entries(ALT).map(([k,v])=>[k,v.l])),PREFS,evalSolo,bigs,kmh,pace,hr,hrR,hrMax,range,css,swP,predict,evaluate,weekCtx,buildWeek,kindOf,raceDur};
}

if(typeof module!=='undefined') module.exports={fmtMin,makeEngine,defaultState,parseD,ymd,addDays,mondayOf,fmtHMS,parseHMS,isoWeek,wd,DAYS,DSHORT,MONTHS};

</script>
<script>
/* ===== Fichiers pour montres : Apple (.workout) et Garmin (.fit) ===== */
const PB={
  vint(n){ const o=[]; n=Math.floor(n); while(n>127){ o.push((n%128)|128); n=Math.floor(n/128); } o.push(n); return o; },
  key(f,w){ return PB.vint(f*8+w); },
  v(f,n){ return [...PB.key(f,0),...PB.vint(n)]; },
  d(f,x){ const b=new Uint8Array(8); new DataView(b.buffer).setFloat64(0,x,true); return [...PB.key(f,1),...b]; },

function monthWeeks(m){
  const first=new Date(m.getFullYear(),m.getMonth(),1), last=new Date(m.getFullYear(),m.getMonth()+1,0);
  const out=[]; for(let ws=mondayOf(first); ws<=last; ws=addDays(ws,7)) out.push(ws); return out;
}
function nextGoal(){ const R=[...myRaces()].filter(r=>r.date>=TODAY).sort((a,b)=>a.date<b.date?-1:1); return R.find(r=>r.prio==='A')||R[0]; }
function fatigue(){
  const now=new Date(); const arr=Object.entries(S.feel||{}).filter(([k,v])=>v&&v.r).map(([k,v])=>({d:parseD(k.split('|')[0]),r:v.r}))
    .filter(x=>x.d<=now&&(now-x.d)/864e5<=10).sort((a,b)=>a.d-b.d);
  if(!arr.length) return null; const last=arr.slice(-3), avg=last.reduce((a,x)=>a+x.r,0)/last.length;
  if((last.length>=2&&avg>=4)||arr.some(x=>x.r===5&&(now-x.d)/864e5<=7)) return {avg}; return null;
}

function planView(){
  const g=nextGoal(); const thisW=EN.weekCtx(mondayOf(new Date())); const fat=fatigue();
  let h=`<div class="monthbar"><button class="iconbtn" data-m="-1" aria-label="Mois précédent">‹</button><h2>${MONTHS[cur.getMonth()]} ${cur.getFullYear()}</h2><button class="iconbtn" data-m="1" aria-label="Mois suivant">›</button></div>`;
  if(fat&&thisW.phase!=='Assimilation') h+=`<div class="alert"><b>Ça tire un peu.</b> Tes dernières séances ont été notées dures (moyenne ${v1(fat.avg)}/5). Une semaine allégée t'aidera à assimiler.<div style="margin-top:8px"><button class="btn sm" data-allege="1">Alléger cette semaine</button></div></div>`;
  h+=`<div class="ctx"><button class="vma" data-tab="prof"><b>${fmtPaceSec(3600/S.profile.vma)}</b><small>allure VMA /km<br>${v1(S.profile.vma)} km/h</small></button>
  <div><div class="small">${g?`Prochain objectif : <b>${esc(g.name)}</b> <span class="chip">${g.prio}</span><br><span class="mut">${parseD(g.date).toLocaleDateString('fr-FR',{day:'numeric',month:'long'})} · dans ${Math.max(0,weeksBetween(mondayOf(new Date()),mondayOf(parseD(g.date))))} sem.</span>`:'<span class="mut">Aucune course au calendrier : cycle foncier. Ajoute tes courses pour une préparation ciblée.</span>'}</div>
  <div style="margin-top:6px" class="row"><span class="chip ph-${thisW.phase.split(' ')[0]}">Cette semaine : ${thisW.phase}</span><button class="btn sm" data-pdfdlg="1">Exporter PDF</button></div></div></div>`;
  const thisMon=mondayOf(new Date()), isCurMonth=cur.getFullYear()===new Date().getFullYear()&&cur.getMonth()===new Date().getMonth();
  const allW=monthWeeks(cur), hidden=isCurMonth&&!showPastWeeks?allW.filter(ws=>ws<thisMon).length:0;
  if(hidden) h+=`<button class="btn ghost sm" data-showpast="1" style="width:100%;margin-top:4px">↑ Voir ${hidden>1?'les '+hidden+' semaines précédentes':'la semaine précédente'} du mois</button>`;
  for(const ws of allW.slice(hidden)){
    const W=EN.buildWeek(ws), c=W.ctx; let tot=0; for(let i=0;i<7;i++) W.days[i].forEach(s=>{ if(s.cat!=='race') tot+=s.dur||0; });
    const mixed=S.profile.mixWeek?' + '+(c.mode==='piste'?'route':'piste'):'';
    h+=`<section class="week"><div class="weekhead"><h3>Sem. du ${ws.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</h3><span class="chip ph-${c.phase.split(' ')[0]}">${c.phase}</span>${c.target?`<span class="chip">${esc(c.target.name)} J-${Math.round((parseD(c.target.date)-ws)/864e5)}</span>`:''}${W.frozen?'<span class="chip" title="Semaine passée : programme figé">🔒 Figée</span>':''}<span class="chip">Fractionné ${c.mode}${mixed}</span></div>
    <div class="wsum">${ribbonHTML(ws,W)}${gaugeHTML(ws,W)}</div><div class="card" style="padding:4px 12px">`;
    for(let i=0;i<7;i++){ const d=addDays(ws,i), dk=ymd(d), inM=d.getMonth()===cur.getMonth(), ss=W.days[i];
      h+=`<div class="day ${dk===TODAY?'today':''} ${inM?'':'out'}" id="d-${dk}"><div class="dlabel">${DSHORT[i]}<b>${d.getDate()}</b></div><div class="sessions">${ss.length?ss.map(s=>sessRow(ws,dk,s)).join(''):'<div class="rest">Repos</div>'}</div></div>`; }
    h+='</div></section>';
  }
  h+=`<p class="hint">Touche une séance pour l'ouvrir. Balaye vers la droite : faite ✓. Vers la gauche : changer. Les pastilles résument la semaine (vert EF → rouge VMA, bleu natation, violet renfo, or course).</p>`;
  return h;
}

  if(e.target.closest('[data-pdfdlg]')){ pdfDialog(); return; }

      if(id==='keep'){ if(S.profile.prefs&&S.profile.prefs[ty]) S.swaps[k]='keep'; else delete S.swaps[k]; } else S.swaps[k]=id;
      const pref=$('#chgpref'); if(pref&&pref.classList.contains('on')&&id!=='keep'&&EN.PREFS[ty]&&EN.PREFS[ty].includes(id)){ S.profile.prefs=Object.assign({},S.profile.prefs,{[ty]:id}); }
      closeModal(); save(); render(); toast(id==='keep'?'Séance prévue rétablie':'Séance changée'); return; }
    if(e.target.closest('#chgpref')){ $('#chgpref').classList.toggle('on'); return; }
  }
  if(e.target.closest('[data-howto]')){ view='guide'; render(); setTimeout(()=>{ const g=document.getElementById('g-apple'); if(g){ g.open=true; document.getElementById('g-garmin').open=true; g.scrollIntoView({behavior:'smooth'}); } },50); return; }
  // modales
  if(modalKind==='pdf'){
    if(t=e.target.closest('[data-pn]')){ pdfOpt.n=+t.dataset.pn; $('#sheet').querySelectorAll('[data-pn]').forEach(b=>b.classList.toggle('on',b===t)); return; }
    if(e.target.id==='pics'){ const st=parseD($('#pstart').value); await exportICS(st,pdfOpt.n); closeModal(); return; }
    if(e.target.id==='pgo'){ const st=parseD($('#pstart').value); t=e.target; t.disabled=true; t.textContent='Génération…'; await exportPDF(st,pdfOpt.n); closeModal(); return; }
  }
  if(t=e.target.closest('[data-edit]')){ const id=t.dataset.edit; raceForm(id?myRaces().find(x=>String(x.id)===id):null); return; }
  if(t=e.target.closest('[data-bedit]')){ const id=t.dataset.bedit; blockForm(id?S.blocks.find(x=>String(x.id)===id):null); return; }
  if(modalKind==='race'){
    if(t=e.target.closest('[data-prio]')){ editing.prio=t.dataset.prio; drawForm(); return; }
    if(t=e.target.closest('[data-type]')){ editing.type=t.dataset.type; drawForm(); return; }
    if(t=e.target.closest('[data-terrain]')){ editing.terrain=t.dataset.terrain; drawForm(); return; }
    if(t=e.target.closest('[data-duo]')){ editing.duo=t.dataset.duo==='1'; drawForm(); return; }
    if(t=e.target.closest('[data-partner]')){ editing.partner=t.dataset.partner; drawForm(); return; }
    if(e.target.id==='rdel'){ if(e.target.dataset.sure){ const od=ath(editing._owner).data; od.races=od.races.filter(x=>x.id!==editing.id); save(); closeModal(); render(); } else { e.target.dataset.sure=1; e.target.textContent='Confirmer la suppression'; } return; }
    if(e.target.id==='rsave'){ const r=editing;
      if(!r.name||!r.date||!(+r.km)){ toast('Nom, date et distance sont nécessaires'); return; }
      if(r.goal&&!parseHMS(r.goal)){ toast('Objectif non reconnu : écris par ex. 1:45:00'); return; }
      if(r.duo&&!ath(r.partner)){ toast('Choisis le coéquipier du binôme'); return; } if(r.type!=='swimrun') r.duo=false;
      const od=ath(r._owner).data, clean=Object.assign({},r); delete clean._owner; const i=od.races.findIndex(x=>x.id===r.id); if(i>=0) od.races[i]=clean; else od.races.push(clean);
      save(); closeModal(); render(); toast('Course enregistrée, programme mis à jour'); return; }
  }
  if(modalKind==='block'){
    if(t=e.target.closest('[data-bk]')){ bed.kind=t.dataset.bk; drawBlock(); return; }
    if(e.target.id==='bdel'){ if(e.target.dataset.sure){ S.blocks=S.blocks.filter(x=>x.id!==bed.id); save(); closeModal(); render(); } else { e.target.dataset.sure=1; e.target.textContent='Confirmer la suppression'; } return; }
    if(e.target.id==='bsave'){ if(!bed.from||!bed.to||bed.to<bed.from){ toast('Vérifie les dates'); return; }
      const i=S.blocks.findIndex(x=>x.id===bed.id); if(i>=0) S.blocks[i]=bed; else S.blocks.push(bed); save(); closeModal(); render(); toast('Période enregistrée'); return; }

  else if(t=e.target.closest('[data-av]')){ const [k,i]=t.dataset.av.split(':'); const a=P.avail[k], n=+i; P.avail[k]=a.includes(n)?a.filter(x=>x!==n):[...a,n].sort(); save(); render(); }
  else if(t=e.target.closest('[data-wmax]')){ P.weekdayMax=+t.dataset.wmax; save(); render(); }
  else if(t=e.target.closest('[data-max]')){ P.maxRun=+t.dataset.max; save(); render(); }
  else if(t=e.target.closest('[data-vm]')){ P.vmaMode=t.dataset.vm; save(); render(); }
  else if(t=e.target.closest('[data-lr]')){ P.lrDay=t.dataset.lr===''?null:+t.dataset.lr; if(P.lrDay!=null&&!P.avail.run.includes(P.lrDay)) P.avail.run=[...P.avail.run,P.lrDay].sort(); save(); render(); }
  else if(t=e.target.closest('[data-sex]')){ P.sex=t.dataset.sex; save(); render(); }
  else if(t=e.target.closest('[data-tog]')){ P[t.dataset.tog]=!P[t.dataset.tog]; save(); render(); }
  else if(t=e.target.closest('[data-pref]')){ const [ty,id]=t.dataset.pref.split('|'); P.prefs=Object.assign({},P.prefs); if(id) P.prefs[ty]=id; else delete P.prefs[ty]; save(); render(); }
  else if(t=e.target.closest('[data-lvl]')){ P.level=t.dataset.lvl; save(); render(); toast('Niveau : '+t.textContent+' (semaine en cours et suivantes)'); }
  else if(e.target.id==='refreeze'){ if(e.target.dataset.sure){ unfreeze(); freezeAll(); open.clear(); save(); render(); toast('Semaines passées recalculées'); } else { e.target.dataset.sure=1; e.target.textContent='Confirmer : recalculer le passé'; } }
  else if(t=e.target.closest('[data-rset]')){ const k=t.dataset.rset; ROOT.settings[k]=!ROOT.settings[k]; lastCore=''; save(); render(); }
  else if(t=e.target.closest('[data-acol]')){ activeAth().color=t.dataset.acol; save(); render(); }
  else if(e.target.id==='adel'){ if(e.target.dataset.sure){ const id=ROOT.active; if(G.on) gMarkDeleted(id); ROOT.profiles=ROOT.profiles.filter(p=>p.id!==id); ROOT.profiles.forEach(p=>{ if(!p.ro) p.data.races.forEach(r=>{ if(r.partner===id){ r.duo=false; r.partner=null; } }); }); ROOT.active=(editables()[0]||ROOT.profiles[0]).id; refresh(); open.clear(); save(); view='team'; render(); toast('Sportif supprimé'); } else { e.target.dataset.sure=1; e.target.textContent='Confirmer : supprimer '+activeAth().name+' et tout son programme'; } }
  else if(e.target.id==='tapply'){ const a=+$('#t6').value, b=+$('#t12').value; const v=a?a/100:b?b/200:0; if(v>8&&v<26){ P.vma=Math.round(v*100)/100; save(); render(); toast('Allure VMA mise à jour : '+fmtPaceSec(3600/P.vma)+'/km'); } else toast('Saisis une distance en mètres'); }
  else if(e.target.id==='sapply'){ const a=parseHMS($('#s400').value), b=parseHMS($('#s200').value); if(a&&b&&a>b){ P.css=Math.round((a-b)/2); save(); render(); toast('CSS : '+fmtPaceSec(P.css)+'/100 m'); } else toast('Saisis les deux temps, ex. 7:40 et 3:35'); }
  else if(e.target.id==='saHtml'){ SA.saveHtml(); }
  else if(e.target.id==='saLink'){ SA.link(); }
  else if(e.target.id==='saOpen'){ SA.openLinked(); }
  else if(e.target.id==='saResume'){ SA.resume(); }
  else if(e.target.id==='saUnlink'){ SA.unlink(); }
  else if(e.target.id==='saBanner'){ SA.quickSave(); }
  else if(t=e.target.closest('[data-pick]')){ SA.pick(t.dataset.pick); }
  else if(e.target.id==='bkdown'){ flush(); const name='coach-sauvegarde-'+ymd(new Date())+'.json'; const prev=ROOT.lastBackup; ROOT.lastBackup=new Date().toISOString();
    const ok=await offerFile(name,JSON.stringify(Object.assign({app:'coach-course-swimrun',version:3},ROOT),null,1)); if(ok){ save(); render(); toast('Sauvegarde téléchargée'); } else ROOT.lastBackup=prev; }
  else if(e.target.id==='bkok'&&pendingRestore){ setRoot(pendingRestore); pendingRestore=null; open.clear(); lastCore=''; save(); render(); toast('Sauvegarde restaurée'); }
  else if(e.target.id==='bkno'){ pendingRestore=null; $('#bkpreview').innerHTML=''; }

document.addEventListener('change',e=>{
  if(e.target.dataset.fc){ const k=e.target.dataset.fc; S.feel[k]=Object.assign({},S.feel[k],{c:e.target.value}); save(); return; }
  if(e.target.id==='bkfile'){ const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{ try{ const o=SA.parseAny(rd.result); if(!(o.profiles||(o.profile&&o.profile.vma))) throw 0; pendingRestore=o; const m=migrate(o);
      $('#bkpreview').innerHTML=`<div class="ev rea" style="margin-top:10px"><b>Sauvegarde du ${o.savedAt?when(o.savedAt):'?'}</b>${m.profiles.length} sportif(s) : ${m.profiles.map(p=>esc(p.name)+' ('+p.data.races.length+' course(s))').join(', ')}. Elle remplacera tous les profils actuels.<div class="row" style="margin-top:8px"><button class="btn sm" id="bkok">Restaurer</button><button class="btn ghost sm" id="bkno">Annuler</button></div></div>`;
    }catch(err){ toast('Fichier de sauvegarde non reconnu'); } }; rd.readAsText(f); return; }
  if(e.target.dataset.aname){ const v=e.target.value.trim(); if(v){ activeAth().name=v; save(); render(); } return; }
  const k=e.target.dataset.p; if(!k) return; const P=S.profile, v=e.target.value.trim();
  if(k==='vma'){ const x=parseHMS(v); if(x&&x>=140&&x<=450) P.vma=3600/x; }
  else if(k==='swim100'||k==='css'){ const s=v?parseHMS(v):null; P[k]= s&&s>40&&s<400?s:null; }
  else P[k]= v?+v:null;
  save(); render();
});

/* ---------- changer de séance ---------- */
let chgKey=null;
function chgSheet(key){
  const s=SESS[key]; if(!s||!s.alts) return; chgKey=key; modalKind='chg';
  const ty=s.swapped?s.swapped.fromType:s.type, canPref=!!EN.PREFS[ty];
  $('#sheet').innerHTML=`<h3>Changer de séance</h3><p class="hint" style="margin-top:0">${s.swapped?'Séance prévue au départ : <b>'+esc(s.swapped.from)+'</b>':'Séance prévue : <b>'+esc(s.title)+'</b>'}. Choisis une alternative qui travaille le même objectif.</p>
  <div class="list">${s.alts.filter(a=>!(s.swapped&&a.id===s.swapped.id)).map(a=>`<button class="card alt" data-alt="${a.id}"><b>${esc(a.l)}</b><span class="small mut">${esc(a.why)}</span></button>`).join('')}
  ${s.swapped?`<button class="card alt" data-alt="keep"><b>↺ Revenir à la séance prévue</b><span class="small mut">${esc(s.swapped.from)}</span></button>`:''}</div>
  ${canPref?`<div class="toggle" style="margin-top:12px"><span class="small">Toujours remplacer les séances « ${esc(ty)} » par ce choix (préférence de ${esc(activeAth().name)})</span><button class="sw" id="chgpref" aria-label="En faire une préférence"></button></div>`:''}
  <div class="row between" style="margin-top:12px"><span></span><button class="btn ghost" data-close="1">Annuler</button></div>`;
  $('#modal').classList.add('show');
}

function renderWho(){ if(GATE||!ROOT){ $('#who').innerHTML=''; return; } const p=activeAth(); $('#who').innerHTML=`<i style="background:${p.color}"></i>${esc(p.name)}${G.on&&!G.admin?'':' ▾'}`; }
function nextSession(pid){ const e=engineFor(pid,true); const now=new Date(); now.setHours(0,0,0,0);
  for(let i=0;i<21;i++){ const d=addDays(now,i), W=e.buildWeek(mondayOf(d)), ss=W.days[wd(d)].filter(s=>s.cat!=='off'); if(ss.length) return {d,ss}; } return null; }
function teamView(){

async function sendToWatch(kind,key){
  const s=SESS[key]; if(!s||!s.wk) return;
  const dk=key.split('|')[0], d=parseD(dk);
  const clean=s.title.replace(/[·×'"\/:*?<>|]/g,' ').replace(/\s+/g,' ').trim();
  const who=MULTI()?activeAth().name:''; const base=(who?who+' ':'')+dk+' '+clean, name=pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+' '+s.title+(who?' ('+who+')':'');
  let data, ext;
  try{ if(kind==='apple'){ data=encAppleWorkout(name,s.wk); ext='.workout'; } else { data=encGarminFit(name,s.wk); ext='.fit'; } }
  catch(err){ toast('Impossible de créer le fichier pour cette séance'); return; }
  const ok=STANDALONE? await offerFile(base+ext,data) : await offerFile(base+(kind==='apple'?' Apple':' Garmin')+'.zip',makeZip([{name:base+ext,data}]));
  if(ok&&STANDALONE) toast(kind==='apple'?'Fichier .workout téléchargé : envoie-le-toi par Messages':'Fichier .fit téléchargé'); else if(ok) toast(kind==='apple'?'Ouvre le zip dans Fichiers, puis touche le fichier .workout':'Dézippe dans Fichiers, puis importe le .fit dans intervals.icu');
}

/* ---------- calendrier (.ics) ---------- */
function icsEsc(t){ return String(t).replace(/‹([^›]*)›/g,'($1)').replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){ const enc=new TextEncoder(); let out='', cur='', n=0; for(const ch of line){ const b=enc.encode(ch).length; if(n+b>73){ out+=cur+'\r\n '; cur=''; n=1; } cur+=ch; n+=b; } return out+cur; }
async function exportICS(start,nMonths){
  const who=MULTI()?activeAth().name:''; const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Coach Course Swimrun//FR','CALSCALE:GREGORIAN','X-WR-CALNAME:'+icsEsc('Entraînement'+(who?' '+who:''))];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const EMO={run:'🏃',swim:'🏊',renfo:'💪',race:'🏁',off:'⏸'}; let count=0; const seen=new Set();
  for(let k=0;k<nMonths;k++){ const m=new Date(start.getFullYear(),start.getMonth()+k,1);
    for(const ws of monthWeeks(m)){ const W=EN.buildWeek(ws);

    catch(err){ if(err&&err.code==='declined') return false; } }

    if(directDownload('Coach-Course-Swimrun-'+stamp()+'.html',new Blob([html],{type:'text/html'}))){ markSaved(); flush(); banner(); render(); toast('Appli + données enregistrées : garde ce fichier, c\'est ta sauvegarde'); }
  }

  async function link(){ try{ const h=await window.showSaveFilePicker({suggestedName:'coach-donnees.json',types:[{description:'Données Coach',accept:{'application/json':['.json']}}]}); handle=h; perm=true; await putH(h); await writeFile(); render(); toast('Enregistrement automatique activé dans '+h.name); }catch(e){ if(e&&e.name!=='AbortError') toast('Impossible de lier ce fichier'); } }

      :`<div class="row" style="flex-wrap:wrap;margin-top:10px"><button class="btn ghost sm" id="saLink">Activer l'enregistrement automatique</button><button class="btn ghost sm" id="saOpen">Ouvrir un fichier lié</button></div>
      <p class="hint">Chrome / Edge : choisis un fichier (ex. dans Documents) où l'appli écrit à chaque modification. Après un nettoyage du navigateur, « Ouvrir un fichier lié » recharge tout depuis ce fichier.</p>`)
      :`<p class="hint">Ce navigateur ne permet pas l'enregistrement automatique dans un fichier (seuls Chrome et Edge sur ordinateur le font). Utilise l'enregistrement .html ci-dessus.</p>`}</div>`;
  }

const SESSWS={}, SESSDK={};
const TAGOF=s=>({run:s.type,swim:'Natation · '+s.type,renfo:'Renforcement',race:'Compétition',off:'Pause'}[s.cat]||'');
function intensOf(st){ const V=S.profile.vma;
  if(st.pace){ const pct=3600/st.pace/V*100; return pct>=97?4:pct>=89?3:pct>=82?2:pct>=76?1:0; }
  if(st.hr){ const p=(st.hr[0]+st.hr[1])/2/EN.hrMax(); return p>=0.88?2:p>=0.83?1:0; }
  return st.p==='work'?2:0; }
function segsOf(s){ const wk=s.wk; if(!wk) return null; const out=[];
  const dur=st=>st.g[0]==='time'?st.g[1]:st.g[0]==='dist'?st.g[1]/(st.pace?1000/st.pace:EN.kmh(75)/3.6):(st.p==='rec'?60:90);
  if(wk.warm) out.push({c:'w',d:wk.warmStep&&wk.warmStep.g[0]==='time'?wk.warmStep.g[1]:1200});
  for(const B of wk.blocks) for(let i=0;i<B.iter;i++) for(const st of B.steps) out.push({c:st.p==='rec'?'r':'i'+intensOf(st),d:dur(st)});
  if((wk.warm&&wk.cool!==false)||wk.coolStep) out.push({c:'w',d:wk.coolStep&&wk.coolStep.g[0]==='time'?wk.coolStep.g[1]:600});
  if(out.length>100){ const m=[]; for(const x of out){ const l=m[m.length-1]; if(l&&l.c===x.c) l.d+=x.d; else m.push(Object.assign({},x)); } return m; }
  return out; }
function schemaHTML(s,big){ const sg=segsOf(s); if(!sg||!sg.length) return '';
  return `<div class="schema ${big?'big':''}" aria-hidden="true">${sg.map(x=>`<i class="sg-${x.c}" style="flex-grow:${Math.max(1,Math.round(x.d))}"></i>`).join('')}</div>`; }

function maxIntens(s){ if(s.cat==='race') return 'krc'; if(s.cat==='swim') return 'ksw'; if(s.cat==='renfo') return 'krf'; const sg=segsOf(s); if(!sg) return 'x0'; let m=0; sg.forEach(x=>{ if(x.c[0]==='i') m=Math.max(m,+x.c[1]); }); return 'x'+m; }

  if(s.wk){ let best=null; for(const B of s.wk.blocks) for(const st of B.steps) if(st.p==='work'){ const it=intensOf(st); if(!best||it>best.it) best={st,it,B}; }
    if(best){ if(best.st.pace) k.push(['Allure',fmtPaceSec(best.st.pace)+'/km']); else if(best.st.hr) k.push(['FC',best.st.hr[0]+'–'+best.st.hr[1]]);

  return k; }

/* ---- semaine : ruban + jauge ---- */
const ORDER=['krc','x4','x3','x2','x1','x0','ksw','krf'];
function weekTotal(W){ let t=0; for(let i=0;i<7;i++) W.days[i].forEach(s=>{ if(s.cat!=='race'&&s.cat!=='off') t+=s.dur||0; }); return t; }
function ribbonHTML(ws,W){ return `<div class="ribbon">${DSHORT.map((d,i)=>{ const ss=W.days[i].filter(s=>s.cat!=='off'), dk=ymd(addDays(ws,i));
    const cls=ss.length?ss.map(maxIntens).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b))[0]:'', dn=ss.length&&ss.every(s=>S.done[s.key]);
    return `<button class="rd ${dk===TODAY?'today':''}" data-goday="${dk}" aria-label="${DAYS[i]} ${addDays(ws,i).getDate()}"><i class="${cls} ${dn?'dn':''}"></i>${d[0]}</button>`; }).join('')}</div>`; }
function gaugeHTML(ws,W){ const t=weekTotal(W), NORMAL=['Foncier','Développement','Spécifique'], light=!NORMAL.includes(W.ctx.phase);
  const ref=[]; for(let k=1;k<=8&&ref.length<3;k++){ const P=EN.buildWeek(addDays(ws,-7*k)); if(NORMAL.includes(P.ctx.phase)) ref.push(weekTotal(P)); }
  const avg=ref.length?ref.reduce((a,b)=>a+b,0)/ref.length:0, diff=avg?Math.round((t-avg)/avg*100):0, hot=!light&&diff>15, scale=Math.max(t,avg,60)*1.08;
  const lab=light?'semaine allégée':avg?(diff>=0?'+':'')+diff+' % vs moy. 3 sem.':'';
  return `<div class="gauge"><div class="tr"><div class="fl ${hot?'hot':''}" style="width:${Math.round(t/scale*100)}%"></div>${avg?`<div class="avgmark" style="left:${Math.round(avg/scale*100)}%"></div>`:''}</div><small>${fmtMin(t)} d'entraînement${lab?' · '+lab:''}${hot?' ⚠︎':''}</small></div>`; }

  if(t=e.target.closest('[data-swtoday]')){ switchAth(t.dataset.swtoday); render(); toast('Programme de '+activeAth().name); return; }

});
/* toucher = ouverture immédiate ; glisser = fait / changer */
(()=>{ let st=null;
  document.addEventListener('pointerdown',e=>{ const r=e.target.closest('.srow'); if(!r||e.target.closest('button')) return; st={r,x:e.clientX,y:e.clientY,dx:0,drag:false,id:e.pointerId,t0:Date.now(),moved:0}; },{passive:true});
  document.addEventListener('pointermove',e=>{ if(!st||e.pointerId!==st.id) return; const dx=e.clientX-st.x, dy=e.clientY-st.y; st.moved=Math.max(st.moved,Math.abs(dx),Math.abs(dy));
    if(!st.drag){ if(!(ROOT.settings&&ROOT.settings.noSwipe)&&!st.r.classList.contains('off')&&Math.abs(dx)>16&&Math.abs(dx)>Math.abs(dy)*1.5){ st.drag=true; st.r.classList.add('dragging'); } else if(Math.abs(dy)>12){ st=null; return; } }
    if(st.drag){ st.dx=Math.max(-120,Math.min(120,dx)); st.r.style.transform=`translateX(${st.dx}px)`; } },{passive:true});
  const reset=r=>{ r.classList.remove('dragging'); r.style.transform=''; };
  document.addEventListener('pointerup',e=>{ if(!st) return; const {r,dx,drag,moved,t0}=st; st=null; const key=r.dataset.fiche, s=SESS[key];
    if(!drag){ if(moved<12&&Date.now()-t0<700&&!e.target.closest('button')&&s){ tapOpened=Date.now(); openFiche(key); } return; }
    reset(r); if(Math.abs(dx)>30) swipeSuppress=Date.now(); if(!s) return;
    if(dx>70){ const was=!!S.done[key]; toggleDone(key); toast(was?'Séance remise à faire':'Bravo, séance faite ✓'); }
    else if(dx<-70){ if(s.alts) chgSheet(key); else openFiche(key); } });
  document.addEventListener('pointercancel',()=>{ if(st&&st.r) reset(st.r); st=null; });
})();

/* ===== Onglet Montre : constructeur de séances ===== */
const ZONES={ef:['EF',65,75],active:['Active',75,82],seuil:['Seuil',83,88]};

let WBCLIP=(()=>{ try{ return JSON.parse(localStorage.getItem('coach-clip')||'[]'); }catch(e){ return []; } })();

const clone=o=>JSON.parse(JSON.stringify(o));

/* ---- conversions ---- */
function tgtStep(E,w){ if(w.tgt==='pct') return {pace:3600/E.kmh(+w.tv||90)}; if(w.tgt==='pace') return {pace:+w.tv||300}; if(w.tgt==='zone'){ const z=ZONES[w.z]||ZONES.ef; return {hr:[E.hr(z[1]),E.hr(z[2])]}; } return {}; }
function wbToWk(E,w){
  const blocks=[];
  for(const b of w.blocks){
    if(b.kind==='rest'){ blocks.push({iter:1,steps:[{p:'rec',g:['time',+b.rec.v||60]}]}); continue; }
    const st=[Object.assign({p:'work',g:[b.work.g,+b.work.v||0]},tgtStep(E,b.work))];
    if(b.rec&&b.rec.g!=='none') st.push({p:'rec',g:b.rec.g==='open'?['open',0]:[b.rec.g,+b.rec.v||0]});
    const k=Math.max(1,+b.series||1);
    for(let s=0;s<k;s++){ blocks.push({iter:Math.max(1,+b.iter||1),steps:clone(st)}); if(s<k-1&&+b.sr>0) blocks.push({iter:1,steps:[{p:'rec',g:['time',+b.sr]}]}); }
  }
  const ef=[E.hr(65),E.hr(75)], step=x=>x.t==='open'?{g:['open',0]}:{g:['time',(+x.v||10)*60],hr:ef};
  return {warm:w.warm.t!=='none',warmStep:w.warm.t!=='none'?step(w.warm):null,cool:w.cool.t!=='none',coolStep:w.cool.t!=='none'?step(w.cool):null,blocks};
}
function wbSpeed(E,w){ if(w.tgt==='pct') return E.kmh(+w.tv||90); if(w.tgt==='pace') return 3600/(+w.tv||300); if(w.tgt==='zone'){ const z=ZONES[w.z]||ZONES.ef; return E.kmh((z[1]+z[2])/2); } return E.kmh(80); }
function wbDescribe(E,w){
  const L=[]; const tm=s=>fmtSec(s), dist=m=>m>=1000?String(Math.round(m/100)/10).replace('.',',')+' km':m+' m';
  const wc=(x,lbl)=>x.t==='none'?null:x.t==='open'?lbl+' : libre (tu passes à la suite quand tu es prêt)':lbl+' : '+x.v+"' en EF ("+E.hrR(65,75)+')';
  const a=wc(w.warm,'Échauffement'); if(a) L.push(a);

    const v=wbSpeed(E,b.work), wt=b.work.g==='time'?+b.work.v:(+b.work.v)/(v/3.6), wd=b.work.g==='dist'?+b.work.v:v/3.6*(+b.work.v);
