<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach Course & Swimrun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#F4F2EE;--card:#fff;--ink:#16181D;--mut:#6B6F76;--line:#E4E0D8;--run:#E2552B;--swim:#1C7C93;--renfo:#7A5C9E;--race:#C99400;--ok:#2E8B57;--soft:#FBFAF7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.2px}
button{font:inherit;cursor:pointer;color:inherit}
input,select{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 0;max-width:860px;margin:0 auto}
header.top h1{margin:0;font-size:24px;text-transform:uppercase;line-height:1}
header.top h1 span{color:var(--run)}
.sync{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#bbb;display:inline-block}
.sync.cloud i{background:var(--ok)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--ink);font-weight:600}
nav.tabs button.on svg{color:var(--run)}
@media(min-width:900px){nav.tabs{position:sticky;top:0;bottom:auto;max-width:860px;margin:10px auto 0;border:1px solid var(--line);border-radius:12px}nav.tabs button{flex-direction:row;justify-content:center;font-size:14px;padding:10px}.wrap{padding-bottom:40px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.mut{color:var(--mut)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:#EEEAE2;color:#3b3b3b;white-space:nowrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;display:grid;place-items:center}
.monthbar{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
.monthbar h2{flex:1;text-align:center;margin:0;font-size:26px;text-transform:uppercase}
.ctx{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;margin-bottom:14px}
.vma{background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;text-align:center;border:0}
.vma b{font-family:"Barlow Condensed";font-size:28px;display:block;line-height:1}
.vma small{font-size:11px;opacity:.75}
.week{margin:18px 0 8px}
.weekhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
.weekhead h3{margin:0 6px 0 0;font-size:19px;text-transform:uppercase}
.ph-Foncier{background:#E6EEF6;color:#2B5A85}.ph-Développement{background:#E9F3EA;color:#2E6B3A}.ph-Spécifique{background:#FDEBE3;color:#B2401C}
.ph-Affûtage{background:#FFF4D6;color:#8A6400}.ph-Semaine{background:#16181D;color:#fff}.ph-Assimilation,.ph-Récupération,.ph-Reprise{background:#EFEBF6;color:#5B4682}
.sess.off{border-left-color:#9a9a9a;background:#F6F5F2}.off .tag{color:#777}
.sbody li.ref{font-size:12px;color:var(--mut);list-style:none;margin-left:-18px}
.dchips{display:flex;gap:4px;flex-wrap:wrap}.dchip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 7px;font-size:12px;min-width:38px}.dchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.feel{display:flex;gap:4px;flex-wrap:wrap}.feel button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px;font-size:12px}.feel button.on{background:var(--ok);border-color:var(--ok);color:#fff}.feel button.on.f4,.feel button.on.f5{background:#C0461F;border-color:#C0461F}
.alert{background:#FFEBD9;color:#7A3500;border-radius:12px;padding:11px 12px;margin-bottom:12px;font-size:13.5px}
.seg.wrap{flex-wrap:wrap}.seg.g2{display:grid;grid-template-columns:1fr 1fr}.seg.g2 button{border-bottom:1px solid var(--line)}
.blk{display:flex;align-items:center;gap:10px}.blk .dot{width:10px;height:10px;border-radius:50%;flex:none}
.day{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}

.sessions{display:flex;flex-direction:column;gap:6px;min-width:0}

.swim .tag{color:var(--swim)}.renfo .tag{color:var(--renfo)}.race .tag{color:var(--race)}

.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.sbody{display:none;padding:0 12px 12px 12px;font-size:13.5px}

.sbody ul{margin:0;padding-left:18px}

.list{display:flex;flex-direction:column;gap:10px}
.race-card .name{font-family:"Barlow Condensed";font-size:22px;line-height:1.1}

.prio.A{background:var(--run);color:#fff}.prio.B{background:#F2B79F;color:#6b2210}.prio.C{background:#EEEAE2}
.pred{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pred div{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px}
.pred small{display:block;color:var(--mut);font-size:11.5px}

.ev{margin-top:10px;border-radius:10px;padding:9px 11px;font-size:13.5px}
.ev b{display:block}
.ev.irr{background:#FBE4E1;color:#8E1F12}.ev.amb{background:#FFEBD9;color:#8A3D00}.ev.att{background:#E3F3E6;color:#1F6034}.ev.rea{background:#E3EEF8;color:#1E4C7A}.ev.low{background:#EEEDEA;color:#45464a}
.sec{margin-bottom:14px}
.sec h3{margin:0 0 8px;font-size:20px;text-transform:uppercase}
label.f{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 4px;font-weight:500}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;font-size:15px}

.stepper{display:flex;align-items:center;gap:10px}
.stepper .big{font-family:"Barlow Condensed";font-size:44px;width:120px;text-align:center;border:0;background:none;padding:0}

.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:none;padding:8px 4px;font-size:13.5px}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.avail{display:grid;grid-template-columns:70px repeat(7,1fr);gap:4px;align-items:center;font-size:12px}
.avail .h{text-align:center;color:var(--mut);font-weight:600}
.avail button{height:34px;border-radius:8px;border:1px solid var(--line);background:#fff}
.avail button.on.run{background:var(--run);border-color:var(--run);color:#fff}
.avail button.on.swim{background:var(--swim);border-color:var(--swim);color:#fff}
.avail button.on.renfo{background:var(--renfo);border-color:var(--renfo);color:#fff}
table.z{width:100%;border-collapse:collapse;font-size:13px}
table.z th,table.z td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.z th{font-size:11.5px;color:var(--mut);font-weight:600;text-transform:uppercase}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.sw{width:46px;height:28px;border-radius:999px;background:#ddd;border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--ok)}.sw.on::after{left:21px}
.modal{position:fixed;inset:0;background:rgba(20,20,20,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 26px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 6px;font-size:24px;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:60;display:none;max-width:90vw}
.empty{text-align:center;padding:26px 14px;color:var(--mut)}
.hint{font-size:12.5px;color:var(--mut);margin-top:6px}
.danger{color:#B3261E}
.sabar{position:sticky;top:0;z-index:30;display:none;align-items:center;justify-content:space-between;gap:10px;background:#FFEBD9;color:#7A3500;padding:9px 14px;font-size:13.5px;font-weight:600}.sabar button{border:0;background:#7A3500;color:#fff;border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:6px}.pills button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13.5px}.pills button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.alt{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;border:1px solid var(--line)}.alt b{font-size:15px}
.who{margin-top:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px 4px 6px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}.who i{width:14px;height:14px;border-radius:50%;display:inline-block}
.athcard{width:100%;text-align:left;border:1px solid var(--line)}.athcard.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.adot{width:38px;height:38px;border-radius:50%;color:#fff;display:grid;place-items:center;font-family:'Barlow Condensed';font-size:20px;font-weight:700;flex:none}
.cdot{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}.cdot.on{box-shadow:0 0 0 2px var(--ink)}
header.top{align-items:flex-start}
.gd{padding:0}.gd summary{padding:14px;font-family:'Barlow Condensed';font-size:20px;text-transform:uppercase;cursor:pointer;list-style:none;display:flex;justify-content:space-between}.gd summary::-webkit-details-marker{display:none}.gd summary::after{content:'+';color:var(--run)}.gd[open] summary::after{content:'−'}.gbody{padding:0 14px 14px;font-size:14px}.gbody ol,.gbody ul{padding-left:18px;margin:6px 0}.gbody li{margin:4px 0}.gbody p{margin:8px 0}
.kmh{font-size:.8em;color:var(--mut);margin-left:3px;font-weight:400}
.linkbtn{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;font-size:inherit}
</style>

<body>
<header class="top"><div><h1>Coach <span>Course</span> & Swimrun</h1><button id="who" class="who"></button></div><div id="sync" class="sync"><i></i><span>…</span></div></header>
<nav class="tabs" id="tabs"></nav>
<main class="wrap" id="main"></main>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script type="application/json" id="embedded-data">null</script>
<script>
/* ===== Moteur d'entraînement ===== */
const DAYS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const DSHORT = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

function pad2(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function wd(d){ return (d.getDay()+6)%7; }
function mondayOf(d){ return addDays(d,-wd(d)); }
function weeksBetween(a,b){ return Math.round((b-a)/(7*864e5)); }
function isoWeek(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); }

function defaultState(){
  return {
    profile:{ vma:13.5, fcmax:null, fcrepos:null, age:null, sex:'', swim100:null, css:null,
      avail:{ run:[1,3,5,6], swim:[0,2,4], renfo:[2,4] },
      maxRun:4, weekdayMax:60, prefs:{}, vmaMode:'alt1', mixWeek:false, lrDay:null, swimAllYear:false },
    races:[], done:{}, feel:{}, moves:{}, blocks:[], swaps:{}
  };
}

/* ---------- formats ---------- */
function v1(x){ return (Math.round(x*10)/10).toFixed(1).replace('.',','); }
function fmtSec(s){ s=Math.round(s); if(s<60) return s+'"'; const m=Math.floor(s/60), r=s%60; return r? m+"'"+pad2(r)+'"' : m+"'"; }
function fmtPaceSec(s){ s=Math.round(s); return Math.floor(s/60)+"'"+pad2(s%60); }
function fmtHMS(sec){ sec=Math.round(sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return h? h+'h'+pad2(m)+(s?"'"+pad2(s):'') : m+"'"+pad2(s); }
function fmtMin(m){ m=Math.round(m); return m<60? m+"'" : Math.floor(m/60)+'h'+(m%60?pad2(m%60):''); }
function parseHMS(str){
  if(!str) return null; str=String(str).trim().toLowerCase().replace(/\s/g,'');
  let m=str.match(/^(\d+)h(\d{1,2})?(?:[:'m](\d{1,2}))?/); if(m) return (+m[1])*3600+(+(m[2]||0))*60+(+(m[3]||0));
  const p=str.split(/[:']/).map(x=>x.replace(/[^\d]/g,'')).filter(x=>x!=='').map(Number);
  if(p.length===3) return p[0]*3600+p[1]*60+p[2];
  if(p.length===2) return p[0]*60+p[1];
  if(p.length===1 && p[0]>0) return p[0]*60;
  return null;
}

function makeEngine(S,H){ H=H||{};
  const P=S.profile;
  const kmh=pct=>P.vma*pct/100;
  const pace=v=>fmtPaceSec(3600/v)+'/km ‹'+v1(v)+' km/h›';
  const hrMax=()=>{ if(P.fcmax) return +P.fcmax; const a=+P.age||40; return Math.round(P.sex==='F'? 206-0.88*a : 208-0.7*a); };
  const hr=pct=>{ const mx=hrMax(), rs=+P.fcrepos||60; return Math.round(rs+pct/100*(mx-rs)); };
  const hrR=(lo,hi)=>'FC '+hr(lo)+'–'+hr(hi)+' bpm';
  const range=(lo,hi)=>fmtPaceSec(3600/kmh(lo))+'/km → '+fmtPaceSec(3600/kmh(hi))+'/km ‹'+v1(kmh(lo))+'–'+v1(kmh(hi))+' km/h›';
  const css=()=>{ if(P.css) return +P.css; if(P.swim100) return Math.round(+P.swim100*1.1); return 120; };
  const swP=d=>fmtPaceSec(css()+d)+'/100 m';

  /* ----- répétitions ----- */
  let COL=null;
  function parseRec(r){ if(!r) return null; let m=r.match(/(\d+)\s*m\b/); if(m) return ['dist',+m[1]]; m=r.match(/(\d+)'(\d+)?/); if(m) return ['time',(+m[1])*60+(+(m[2]||0))]; m=r.match(/(\d+)"/); if(m) return ['time',+m[1]]; return ['open',0]; }
  function wStep(o,pct){ return {p:'work',g:o.d?['dist',o.d]:['time',o.t],pace:3600/kmh(pct)}; }
  function toBlocks(list){ const B=[]; for(const e of list){ for(let i=0;i<e.k;i++){ const st=[wStep(e.o,e.pct)]; const rc=parseRec(e.rec); if(rc&&e.n>1) st.push({p:'rec',g:rc}); B.push({iter:e.n,steps:st}); if(e.R&&i<e.k-1) B.push({iter:1,steps:[{p:'rec',g:parseRec(e.R)}]}); } } return B; }
  function reps(n,o,pct,rec,mode){
    if(COL) COL.push({n,o,pct,rec,k:1,R:null});
    const v=kmh(pct); let t;
    if(o.d){ const sec=o.d/(v/3.6);
      t = mode==='piste' ? n+' × '+o.d+' m en '+fmtSec(sec)+' ('+pct+' % · '+pace(v)+')'
                         : n+' × '+fmtSec(sec)+' à '+pace(v)+' ≈ '+o.d+' m';
    } else { const dist=Math.round(v/3.6*o.t/10)*10;
      t = mode==='piste' ? n+' × '+fmtSec(o.t)+' : vise '+dist+' m ('+pct+' % · '+pace(v)+')'
                         : n+' × '+fmtSec(o.t)+' à '+pace(v)+' ≈ '+dist+' m';
    }
    if(o.t>=180 || (o.d && o.d/(v/3.6)>=180)) if(pct<=92) t+=' · '+hrR(pct-3,pct+1);
    return rec&&n>1? t+' — récup '+rec : t;
  }
  const ser=(k,inner,R)=>{ if(COL&&COL.length){ const e=COL[COL.length-1]; e.k=k; e.R=R; } return k+' séries de : '+inner+(R?' · '+R+' entre les séries':''); };

  let CAP=Infinity;
  const tm=(d,pct)=>d/(kmh(pct)/3.6)/60;
  const WARM=(w=20)=>w+"' footing en EF (FC < "+hr(70)+' bpm) + gammes (montées de genoux, talons-fesses, pas chassés, foulées bondissantes : 2 × 30 m chacune) + 3 lignes droites progressives de 80 m';
  const WARM_HILL=(w=20)=>w+"' footing jusqu'à la côte (FC < "+hr(70)+' bpm) + gammes + 2 montées progressives de 20"';
  const COOL=(w=10)=>w+"' footing très lent (FC < "+hr(65)+' bpm) puis étirements doux';

  /* ----- bibliothèques (mm = durée du corps de séance, récup comprises) ----- */
  const VMAC=[
    m=>({t:'VMA courte · 100 m',l:[ser(2,reps(6,{d:100},100,'100 m trot',m),"3'")],mm:2*6*(tm(100,100)+tm(100,60))+3}),
    m=>({t:'VMA courte · 30/30',l:[ser(2,reps(8,{t:30},100,'30" trot',m),"3'")],mm:19}),
    m=>({t:'VMA courte · 200 m',l:[ser(2,reps(4,{d:200},100,'45" trot',m),"3'")],mm:2*4*(tm(200,100)+0.75)+3}),
    m=>({t:'VMA courte · 45/30',l:[ser(3,reps(5,{t:45},100,'30" trot',m),"2'30")],mm:24}),
    m=>({t:'VMA courte · 300 m',l:[ser(2,reps(4,{d:300},97,'1\' trot',m),"3'")],mm:2*4*(tm(300,97)+1)+3}),

  /* ----- swimrun : Big Run / Big Swim ----- */

  /* ----- contexte de semaine ----- */
  const races=()=>[...S.races].filter(r=>r.date).sort((a,b)=>a.date<b.date?-1:1);
  function weekCtx(ws){
    const we=addDays(ws,6), R=races();
    const inWeek=R.filter(r=>{const d=parseD(r.date);return d>=ws&&d<=we;});
    let target=R.find(r=>r.prio==='A'&&parseD(r.date)>=ws&&weeksBetween(ws,mondayOf(parseD(r.date)))<=20)
            || R.find(r=>r.prio==='B'&&parseD(r.date)>=ws&&weeksBetween(ws,mondayOf(parseD(r.date)))<=12) || null;
    const w=target?weeksBetween(ws,mondayOf(parseD(target.date))):null;
    const cyc=(+P.age>=50)?3:4;
    let phase;
    // récupération après une course majeure
    const recent=R.find(r=>{ if(r.prio==='C') return false; const d=parseD(r.date); const long=raceDur(r)>9000;
      const lim=long&&r.prio==='A'?14:7; return d<ws && (ws-d)/864e5<=lim && (r.prio==='A'||raceDur(r)>9000); });
    const long=target&&raceDur(target)>7200;
    const BL=(S.blocks||[]).filter(b=>b.from&&b.to);
    const allege=BL.some(b=>b.kind==='allege'&&parseD(b.from)<=we&&parseD(b.to)>=ws);
    const reprise=BL.some(b=>(b.kind==='blessure'||b.kind==='maladie')&&(parseD(b.to)-parseD(b.from))/864e5>=4&&parseD(b.to)<ws&&(ws-parseD(b.to))/864e5<=7);
    if(reprise && !(target&&w===0)) phase='Reprise';
    else if(recent && !(target&&w===0)) phase='Récupération';
    else if(allege && !(target&&w<=1)) phase='Assimilation';
    else if(!target) phase=(isoWeek(ws)%cyc===0)?'Assimilation':'Foncier';
    else if(w===0) phase='Semaine de course';
    else if(w===1 || (long&&w===2)) phase='Affûtage';
    else if(w<=6) phase='Spécifique';
    else if(w<=12) phase=((w-7)%cyc===0)?'Assimilation':'Développement';
    else phase=((w-7)%cyc===0)?'Assimilation':'Foncier';
    // natation
    const swimT=R.find(r=>r.type==='swimrun'&&r.prio!=='C'&&parseD(r.date)>=ws&&weeksBetween(ws,mondayOf(parseD(r.date)))<=16)
             || R.find(r=>r.type==='swimrun'&&parseD(r.date)>=ws&&weeksBetween(ws,mondayOf(parseD(r.date)))<=8) || null;
    const sw=swimT?weeksBetween(ws,mondayOf(parseD(swimT.date))):null;

  function vmaMode(ws){ const m=P.vmaMode; if(m==='piste'||m==='route') return m; const k=Math.round((ws-new Date(2024,0,1))/(7*864e5)); const a=m==='alt2'?Math.floor(k/2)%2:k%2; return a?'route':'piste'; }

  /* ----- placement des jours ----- */

  function place(avail,roles){
    const out={}; let free=[...avail].sort((a,b)=>a-b); const used=[];
    for(const role of roles){

      if(role==='LR'){ pick=(P.lrDay!=null&&free.includes(+P.lrDay))?+P.lrDay:free.includes(6)?6:free.includes(5)?5:free[free.length-1]; }
      else { let best=-1; for(const d of free){ const sc=(used.length?Math.min(...used.map(u=>cd(u,d))):3)*10-(role[0]==='Q'&&d===1?-1:0)-d*0.01; if(sc>best){best=sc;pick=d;} } }

  /* ----- séances course ----- */
  function lrDuration(c){
    const k=c.kind, w=c.w;
    const maxLR={base:75,'10k':75,semi:100,marathon:150,swimrun:(()=>{ const b=bigs(c.target); if(!b) return 120; const m=b.br/kmh(70)*60*1.8; return Math.min(150,Math.max(90,Math.round(m/5)*5)); })(),nature:c.target?Math.min(210,Math.max(90,Math.round(raceDur(c.target)/60*0.6/5)*5)):90}[k];

  function swimPool(c,idx,ph,force){

  const PREFS={'Seuil':['fartlek','tempo','cotesSeuil','courtes'],'VMA courte':['cotesC','fartV'],'VMA longue':['cotesL','fartL'],'Côtes':['plat','fartlek']};
  function altsFor(s,c,iw,cap){

  /* ----- course (jour J) ----- */
  function raceSession(r){
    const ev=evaluate(r); const t=(ev.goal&&ev.goal>=ev.pDay*0.95)?ev.goal:ev.pDay; const l=[];
    const desc=(r.type==='swimrun'?(r.km||0)+' km course + '+(r.swimKm||0)+' km nage':(r.km||0)+' km')+(+r.dplus?' · '+r.dplus+' m D+':'');
    l.push(desc); l.push('Temps visé : '+fmtHMS(t)+(ev.goal?'':' (prévision)'));
    if(r.type==='route'){ const v=(+r.km)/(t/3600); l.push('Allure : '+pace(v)+'. Pars 2–3 s/km plus lent les 2 premiers km'); }
    if(r.type==='nature') l.push('Gère à la FC en montée (sous '+hr(88)+' bpm au début), relance sur le plat et en descente');
    if(r.type==='swimrun') l.push('Nage ~'+swP(10)+', course à la sensation, transitions rapides');
    l.push(t<3600*1.2?"Échauffement : 15' footing + gammes + 3 accélérations":"Échauffement : 10' footing léger, le début de course sert d'échauffement");

  }

  /* ----- semaine ----- */
  function buildWeek(ws){
    let c=weekCtx(ws); const C0=c, Av=P.avail, maxR=Math.max(1,+P.maxRun||4);
    const iw=isoWeek(ws), out={}; for(let i=0;i<7;i++) out[i]=[];
    const ph=c.phase;
    let N={'Foncier':3,'Développement':4,'Spécifique':4,'Affûtage':3,'Semaine de course':3,'Assimilation':2,'Récupération':2,'Reprise':3}[ph];
    if(ph==='Spécifique'&&(c.kind==='marathon'||c.kind==='nature')&&maxR>=5) N=5;
    if(ph==='Foncier'&&maxR>=5) N=4;
    N=Math.min(N,maxR,new Set(Av.run.concat(P.lrDay!=null?[+P.lrDay]:[])).size);
    let roles;
    switch(ph){
      case 'Foncier': roles=['LR','Q1','Q2','E','E']; break;
      case 'Développement': roles=['LR','Q1','Q2','E','E']; break;
      case 'Spécifique': roles=['LR','Q1','Q2','E','E']; break;
      case 'Affûtage': roles=['LR','Q1','E','E']; break;
      case 'Assimilation': roles=['LR','E+','E']; break;
      case 'Récupération': roles=['E','E']; break;
      case 'Reprise': roles=['R','R','E']; break;
      default: roles=['Q1','E','E'];
    }
    roles=roles.slice(0,N);
    const raceDays=c.inWeek.map(r=>({r,d:wd(parseD(r.date))}));
    const runAv=[...new Set(Av.run.concat(P.lrDay!=null&&roles.includes('LR')?[+P.lrDay]:[]))];
    let runMap=place(runAv,roles);
    { const q1=Object.keys(runMap).find(k=>runMap[k]==='Q1'), q2=Object.keys(runMap).find(k=>runMap[k]==='Q2'); if(q1&&q2&&+q2<+q1){ runMap[q1]='Q2'; runMap[q2]='Q1'; } }
    // ajustements semaine de course
    if(raceDays.length){
      for(const {r,d} of raceDays){
        for(const k of Object.keys(runMap)){ const day=+k;
          if(day===d||day===d-1) delete runMap[k];
          else if(r.prio!=='C'&&day>d) runMap[k]='E-';
          else if(r.prio==='A'||r.prio==='B'){ if(runMap[k]==='LR'||runMap[k]==='Q2') delete runMap[k]; if(runMap[k]==='Q1'&&d-day<3) runMap[k]='E'; }
          else if(runMap[k]==='Q1') delete runMap[k];
        }
        if(r.prio!=='C'){
          if(d>=2&&Av.run.includes(d-2)) runMap[d-2]='PRE';
          else { const before=Object.keys(runMap).map(Number).filter(x=>x<d-1&&runMap[x][0]!=='Q').sort((a,b)=>b-a); if(before.length) runMap[before[0]]='PRE'; }
        }
      }
    }
    const isTest=(ph==='Foncier'&&!c.target&&iw%8===0)||(c.target&&c.w===12);
    for(const [k,role] of Object.entries(runMap)){
      const d=+k; let s; CAP=(d<=4&&+P.weekdayMax)?+P.weekdayMax:Infinity;
      if(role==='LR') s=longRun(c);
      else if(role==='Q1'){
        if(isTest) s=vmaTest(c);
        else if(ph==='Spécifique') s=specific(c,iw);
        else if(ph==='Affûtage') s=c.kind==='nature'?quality('VMAC',c,iw):specific(c,iw);
        else if(ph==='Semaine de course'||raceDays.length) { s=quality('VMAC',c,iw); s.noAlt=true; s.title='Rappel de vitesse'; if(s.wk) s.wk.blocks=s.wk.blocks.slice(0,1); s.blocks[1].l=['Version allégée : '+s.blocks[1].l[0].replace(/^\d séries de : /,'1 série de : ')]; s.dur=40; }
        else if(ph==='Développement') s=quality(c.kind==='marathon'||c.kind==='semi'?'VMAL':(iw%2?'VMAC':'VMAL'),c,Math.floor(iw/2));
        else s=quality('VMAC',c,iw);
      }
      else if(role==='Q2'){ const c0=c; c=P.mixWeek?{...c,mode:c.mode==='piste'?'route':'piste'}:c;
        if(ph==='Spécifique') s=c.kind==='nature'?quality('SEUIL',c,iw):(c.kind==='10k'?quality('VMAL',c,iw):quality('SEUIL',c,iw));
        else if(ph==='Développement') s=(c.kind==='nature'&&iw%2===0)?quality('COTES',c,iw):quality('SEUIL',c,Math.max(1,12-c.w));
        else s=(c.kind==='nature'||(c.target&&+c.target.dplus>300))&&iw%2? quality('COTES',c,iw) : (iw%2?quality('VMAL',c,Math.floor(iw/2)%3):quality('SEUIL',c,Math.floor(iw/2)%3));
      }
      else if(role==='R') s=footing(30,'Reprise : 30\' très souple. Arrête si la douleur ou la fatigue revient');
      else if(role==='E+') s=footing(40,'Fartlek libre : 6 × 30" un peu plus vite, au feeling');
      else if(role==='E-') s=footing(30,'Footing de récupération, très souple');
      else if(role==='PRE') s=footing(20,'+ 3 accélérations progressives de 80 m. Veille de course : repos');
      else s=footing(ph==='Récupération'||ph==='Reprise'?35:ph==='Affûtage'?35:ph==='Foncier'?40:45, ph==='Foncier'?'+ 4 lignes droites de 80 m en fin de footing':null);
      if(role==='PRE'||role==='E-'||role==='R') s.noAlt=true; s.alts=altsFor(s,c,iw,CAP); out[d].push(s); c=C0;
    }
    CAP=Infinity;
    for(const {r,d} of raceDays) out[d].unshift(raceSession(r));
    // natation
    if(c.swimT||P.swimAllYear){
      let nS, sph;
      if(!c.swimT){ nS=1; sph='base'; }
      else if(c.sw===0){ nS=1; sph='race'; }
      else if(c.sw<=2){ nS=2; sph='taper'; }
      else if(c.sw<=8){ nS=2; sph='spe'; }
      else if(c.sw<=12){ nS=2; sph='dev'; }
      else { nS=1; sph='base'; }
      if(ph==='Récupération') nS=1;
      const blocked=new Set(); raceDays.forEach(({d})=>{blocked.add(d);blocked.add(d-1);});
      const qDays=Object.entries(runMap).filter(([k,v])=>v==='Q1'||v==='Q2').map(([k])=>+k);
      let cand=P.avail.swim.filter(d=>!blocked.has(d)).sort((a,b)=>{ const sc=x=>(qDays.includes(x)?2:0)+(runMap[x]==='LR'?1:0); return sc(a)-sc(b)||a-b; });
      const chosen=[]; for(const d of cand){ if(chosen.length>=nS) break; if(chosen.every(x=>cd(x,d)>=2)||cand.length<=nS) chosen.push(d); }
      for(const d of cand){ if(chosen.length>=nS) break; if(!chosen.includes(d)) chosen.push(d); }
      chosen.sort((a,b)=>a-b);
      const ow = c.swimT && c.sw>=1 && c.sw<=8;
      chosen.forEach((d,i)=>{ let s;

  const tag={run:s.type,swim:'Natation · '+s.type,renfo:'Renforcement',race:'Compétition',off:'Pause'}[s.cat];
  let act='';
  if(s.cat!=='race'&&s.cat!=='off'){
    act+=`<h4>Déplacer (cette semaine)${s.moved?' · déplacée':''}</h4><div class="dchips">${DSHORT.map((d,j)=>{const dd=addDays(ws,j),t=ymd(dd);return `<button class="dchip ${t===dk?'on':''}" data-mv="${j}" data-key="${esc(key)}" data-ws="${ymd(ws)}">${d} ${dd.getDate()}</button>`;}).join('')}</div>`;
    if(done) act+=`<h4>Ressenti</h4><div class="feel">${FEEL.map((f,i)=>`<button class="f${i+1} ${fe.r===i+1?'on':''}" data-feel="${i+1}" data-key="${esc(key)}">${i+1} · ${f}</button>`).join('')}</div>
      <input class="inp" style="margin-top:6px;font-size:13.5px" data-fc="${esc(key)}" value="${esc(fe.c||'')}" placeholder="Commentaire (sensations, douleur, météo…)">`;
    else act+=`<p class="hint">Coche la séance une fois faite pour noter ton ressenti.</p>`;
  }
  if(s.alts) act=`<h4>Pas envie de cette séance ?</h4><button class="btn ghost sm" data-chg="${esc(key)}">↻ Changer de séance</button>`+act;
  if(s.wk) act+=`<h4>Sur ma montre</h4><div class="row"><button class="btn ghost sm" data-wx="apple" data-key="${esc(key)}">Apple Watch</button><button class="btn ghost sm" data-wx="garmin" data-key="${esc(key)}">Garmin</button></div><p class="hint">Allures cibles à ± 10 s/km${s.wk.warm?', échauffement et retour au calme ouverts (tu passes à la suite quand tu es prêt)':''}. ${STANDALONE?'':'Le fichier arrive dans un .zip : touche-le dans Fichiers pour l\'ouvrir. '}<button class="linkbtn" data-howto="1">Comment faire ?</button></p>`;
  return `<div class="sess ${s.cat} ${done?'done':''} ${isOpen?'open':''}">
    <div class="shead"><button class="shead" style="padding:0;flex:1" data-open="${esc(key)}"><div class="t"><div class="tag">${esc(tag)}${fe.r?' · ressenti '+fe.r+'/5':''}${s.swapped?' · ↻ '+(s.swapped.auto?'préférence':'changée'):''}</div><b>${esc(s.title)}</b><span>${rich(s.sum)}${s.dur?' · ≈ '+fmtMin(s.dur):''}</span></div></button>
    ${s.cat==='off'?'':`<button class="chk ${done?'on':''}" data-done="${esc(key)}" aria-label="Séance faite">${done?'✓':''}</button>`}</div>
    <div class="sbody">${s.blocks.map(b=>`<h4>${esc(b.h)}</h4><ul>${b.l.map(x=>`<li${/^Repère/.test(x)?' class="ref"':''}>${rich(x)}</li>`).join('')}</ul>`).join('')}${act}</div></div>`;
}
function planView(){
  const g=nextGoal(); const thisW=EN.weekCtx(mondayOf(new Date())); const fat=fatigue();
  let h=`<div class="monthbar"><button class="iconbtn" data-m="-1" aria-label="Mois précédent">‹</button><h2>${MONTHS[cur.getMonth()]} ${cur.getFullYear()}</h2><button class="iconbtn" data-m="1" aria-label="Mois suivant">›</button></div>`;
  if(fat&&thisW.phase!=='Assimilation') h+=`<div class="alert"><b>Ça tire un peu.</b> Tes dernières séances ont été notées dures (moyenne ${v1(fat.avg)}/5). Une semaine allégée t'aidera à assimiler.<div style="margin-top:8px"><button class="btn sm" data-allege="1">Alléger cette semaine</button></div></div>`;
  h+=`<div class="ctx"><button class="vma" data-tab="prof"><b>${fmtPaceSec(3600/S.profile.vma)}</b><small>allure VMA /km<br>${v1(S.profile.vma)} km/h</small></button>
  <div><div class="small">${g?`Prochain objectif : <b>${esc(g.name)}</b> <span class="chip">${g.prio}</span><br><span class="mut">${parseD(g.date).toLocaleDateString('fr-FR',{day:'numeric',month:'long'})} · dans ${Math.max(0,weeksBetween(mondayOf(new Date()),mondayOf(parseD(g.date))))} sem.</span>`:'<span class="mut">Aucune course au calendrier : cycle foncier. Ajoute tes courses pour une préparation ciblée.</span>'}</div>
  <div style="margin-top:6px" class="row"><span class="chip ph-${thisW.phase.split(' ')[0]}">Cette semaine : ${thisW.phase}</span><button class="btn sm" data-pdfdlg="1">Exporter PDF</button></div></div></div>`;
  for(const ws of monthWeeks(cur)){
    const W=EN.buildWeek(ws), c=W.ctx; let tot=0; for(let i=0;i<7;i++) W.days[i].forEach(s=>{ if(s.cat!=='race') tot+=s.dur||0; });
    const mixed=S.profile.mixWeek?' + '+(c.mode==='piste'?'route':'piste'):'';
    h+=`<section class="week"><div class="weekhead"><h3>Sem. du ${ws.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</h3><span class="chip ph-${c.phase.split(' ')[0]}">${c.phase}</span>${c.target?`<span class="chip">${esc(c.target.name)} J-${Math.round((parseD(c.target.date)-ws)/864e5)}</span>`:''}<span class="chip">Fractionné ${c.mode}${mixed}</span><span class="chip">≈ ${fmtMin(tot)}</span></div><div class="card" style="padding:4px 12px">`;
    for(let i=0;i<7;i++){ const d=addDays(ws,i), dk=ymd(d), inM=d.getMonth()===cur.getMonth(), ss=W.days[i];
      h+=`<div class="day ${dk===TODAY?'today':''} ${inM?'':'out'}"><div class="dlabel">${DSHORT[i]}<b>${d.getDate()}</b></div><div class="sessions">${ss.length?ss.map(s=>sessHTML(ws,dk,s)).join(''):'<div class="rest">Repos</div>'}</div></div>`; }
    h+='</div></section>';
  }
  h+=`<p class="hint">Touche une séance pour le détail, la déplacer ou noter ton ressenti. Tout se recalcule quand tu changes ta VMA, ta FC ou tes courses.</p>`;
  return h;
}

const TYPES={route:'Route',nature:'Nature / trail',swimrun:'Swimrun'};
function racesView(){
  const R=[...myRaces()].sort((a,b)=>a.date<b.date?-1:1), up=R.filter(r=>r.date>=TODAY), past=R.filter(r=>r.date<TODAY);

  if(!R.length) h+=`<div class="card empty">Ajoute tes courses officielles : le programme se construit autour.<br><br><b>A</b> = objectif majeur (affûtage complet) · <b>B</b> = importante · <b>C</b> = course d'entraînement</div>`;
  h+='<div class="list">'+up.map(raceCard).join('')+'</div>';
  const B=[...S.blocks].sort((a,b)=>a.from<b.from?-1:1).filter(b=>b.to>=ymd(addDays(new Date(),-60)));
  h+=`<div class="row between" style="margin:24px 0 10px"><h2 class="cond" style="margin:0;font-size:22px;text-transform:uppercase">Périodes bloquées</h2><button class="btn ghost sm" data-bedit="">+ Période</button></div>`;
  h+= B.length? '<div class="list">'+B.map(b=>`<div class="card blk"><span class="dot" style="background:${BKIND[b.kind][1]}"></span><div style="flex:1"><b>${BKIND[b.kind][0]}</b><div class="small mut">du ${parseD(b.from).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} au ${parseD(b.to).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}${b.note?' · '+esc(b.note):''}</div></div><button class="btn ghost sm" data-bedit="${b.id}">Modifier</button></div>`).join('')+'</div>'
    : `<p class="hint">Vacances : footings libres, pas de piscine. Blessure / maladie : pause complète, puis une semaine de reprise. Semaine allégée : volume réduit pour récupérer.</p>`;
  if(past.length) h+=`<h3 class="cond mut" style="margin:22px 0 8px;font-size:18px;text-transform:uppercase">Courses passées</h3><div class="list">${past.reverse().map(raceCard).join('')}</div>`;
  return h;

function raceCard(r){
  const ev=EN.evaluate(r); const dt=parseD(r.date).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'long',year:'numeric'});
  const bb=EN.bigs(r); const desc=r.type==='swimrun'?`${r.km||0} km course + ${r.swimKm||0} km nage · Big Run ${String(bb.br).replace('.',',')} km · Big Swim ${bb.bs} m${bb.set?'':' (estimés)'}`:`${r.km||0} km`;
  return `<div class="card race-card"><div class="row"><div class="prio ${r.prio}">${r.prio}</div><div style="flex:1;min-width:0"><div class="name">${esc(r.name)}</div><div class="small mut">${dt} · ${TYPES[r.type]} · ${desc}${+r.dplus?' · '+r.dplus+' m D+':''}</div></div><button class="btn ghost sm" data-edit="${r.id}">Modifier</button></div>
  <div class="pred"><div><small>Prévision aujourd'hui</small><b>${fmtHMS(ev.pNow)}</b></div><div><small>Prévision jour J${ev.w?' (après '+ev.w+' sem.)':''}</small><b>${fmtHMS(ev.pDay)}</b></div></div>
  ${r.duo&&ath(r.partner)?`<p class="hint" style="margin:8px 0 0">Binôme : <b>${esc(ath(r._owner).name)}</b> + <b>${esc(ath(r.partner).name)}</b>${ev.slower?` · prévision calée sur ${esc(ev.slower)}`:` · prévision calée sur ${esc(activeAth().name)}`}</p>`:''}
  ${evHTML(ev,true)}</div>`;
}
function evHTML(ev,withGoal){
  return ev.ev?`<div class="ev ${ev.ev.k}"><b>${withGoal?'Objectif '+fmtHMS(ev.goal)+' : ':''}${ev.ev.l}</b>${withGoal?'':'Prévision jour J : '+fmtHMS(ev.pDay)+'. '}${ev.ev.c}</div>`
    :`<div class="ev low"><b>${withGoal?'Pas d\'objectif chrono':'Prévision jour J : '+fmtHMS(ev.pDay)}</b>Repères : ambitieux ${fmtHMS(ev.suggestAmb)} · réaliste ${fmtHMS(ev.suggestReal)}</div>`;
}

/* ---------- événements ---------- */
let pendingRestore=null;
document.addEventListener('click',async e=>{
  const P=S.profile; let t;
  if(t=e.target.closest('[data-tab]')){ view=t.dataset.tab; if(t.dataset.close) closeModal(); render(); window.scrollTo(0,0); return; }
  if(e.target.closest('#who')){ whoSheet(); return; }
  if(t=e.target.closest('[data-goath]')){ switchAth(t.dataset.goath); view='plan'; render(); window.scrollTo(0,0); return; }
  if(t=e.target.closest('[data-swath]')){ switchAth(t.dataset.swath); closeModal(); render(); toast('Programme de '+activeAth().name); return; }
  if(e.target.closest('[data-addath]')){ athForm(); return; }
  if(modalKind==='ath'){
    if(t=e.target.closest('[data-acopy]')){ athDraft.copy=t.dataset.acopy; drawAth(); return; }

      const src=athDraft.copy&&ath(athDraft.copy); const used=ROOT.profiles.map(p=>p.color);
      const p={id:'p'+Date.now(),name:nm,color:COLORS.find(c=>!used.includes(c))||COLORS[ROOT.profiles.length%COLORS.length],data:mergeAth(src?{profile:JSON.parse(JSON.stringify(src.data.profile))}:{})};
      ROOT.profiles.push(p); switchAth(p.id); closeModal(); view='prof'; render(); window.scrollTo(0,0); toast(nm+' ajouté·e : complète son profil'); return; }
  }
  if(e.target.id==='modal'||(e.target.closest('[data-close]')&&!e.target.closest('[data-tab]'))){ closeModal(); return; }
  // programme
  if(t=e.target.closest('[data-m]')){ cur=new Date(cur.getFullYear(),cur.getMonth()+(+t.dataset.m),1); render(); return; }
  if(t=e.target.closest('[data-open]')){ const id=t.dataset.open; open.has(id)?open.delete(id):open.add(id); t.closest('.sess').classList.toggle('open'); return; }
  if(t=e.target.closest('[data-done]')){ const k=t.dataset.done; if(S.done[k]) delete S.done[k]; else { S.done[k]=1; open.add(k); } save(); render(); return; }
  if(t=e.target.closest('[data-mv]')){ const key=t.dataset.key, orig=key.split('|')[0], target=ymd(addDays(parseD(t.dataset.ws),+t.dataset.mv));
    if(target===orig) delete S.moves[key]; else S.moves[key]=target; save(); render(); toast(target===orig?'Séance remise à sa place':'Séance déplacée au '+parseD(target).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric'})); return; }
  if(t=e.target.closest('[data-feel]')){ const k=t.dataset.key; S.feel[k]=Object.assign({},S.feel[k],{r:+t.dataset.feel}); save(); render(); return; }
  if(e.target.closest('[data-allege]')){ const m=mondayOf(new Date()); S.blocks.push({id:Date.now(),kind:'allege',from:ymd(m),to:ymd(addDays(m,6)),note:'Fatigue ressentie'}); save(); render(); toast('Semaine allégée'); return; }
  if(e.target.closest('[data-pdfdlg]')){ pdfDialog(); return; }
  if(t=e.target.closest('[data-wx]')){ sendToWatch(t.dataset.wx,t.dataset.key); return; }
  if(t=e.target.closest('[data-chg]')){ chgSheet(t.dataset.chg); return; }
  if(modalKind==='chg'){
    if(t=e.target.closest('[data-alt]')){ const k=chgKey, s=SESS[k], id=t.dataset.alt, ty=s.swapped?s.swapped.fromType:s.type;
      if(id==='keep'){ if(S.profile.prefs&&S.profile.prefs[ty]) S.swaps[k]='keep'; else delete S.swaps[k]; } else S.swaps[k]=id;
      const pref=$('#chgpref'); if(pref&&pref.classList.contains('on')&&id!=='keep'&&EN.PREFS[ty]&&EN.PREFS[ty].includes(id)){ S.profile.prefs=Object.assign({},S.profile.prefs,{[ty]:id}); }
      closeModal(); save(); render(); toast(id==='keep'?'Séance prévue rétablie':'Séance changée'); return; }
    if(e.target.closest('#chgpref')){ $('#chgpref').classList.toggle('on'); return; }
  }
  if(e.target.closest('[data-howto]')){ view='guide'; render(); setTimeout(()=>{ const g=document.getElementById('g-apple'); if(g){ g.open=true; document.getElementById('g-garmin').open=true; g.scrollIntoView({behavior:'smooth'}); } },50); return; }
  // modales
  if(modalKind==='pdf'){
    if(t=e.target.closest('[data-pn]')){ pdfOpt.n=+t.dataset.pn; $('#sheet').querySelectorAll('[data-pn]').forEach(b=>b.classList.toggle('on',b===t)); return; }
    if(e.target.id==='pgo'){ const st=parseD($('#pstart').value); t=e.target; t.disabled=true; t.textContent='Génération…'; await exportPDF(st,pdfOpt.n); closeModal(); return; }
  }
  if(t=e.target.closest('[data-edit]')){ const id=t.dataset.edit; raceForm(id?myRaces().find(x=>String(x.id)===id):null); return; }
  if(t=e.target.closest('[data-bedit]')){ const id=t.dataset.bedit; blockForm(id?S.blocks.find(x=>String(x.id)===id):null); return; }
  if(modalKind==='race'){
    if(t=e.target.closest('[data-prio]')){ editing.prio=t.dataset.prio; drawForm(); return; }
    if(t=e.target.closest('[data-type]')){ editing.type=t.dataset.type; drawForm(); return; }
    if(t=e.target.closest('[data-terrain]')){ editing.terrain=t.dataset.terrain; drawForm(); return; }
    if(t=e.target.closest('[data-duo]')){ editing.duo=t.dataset.duo==='1'; drawForm(); return; }
    if(t=e.target.closest('[data-partner]')){ editing.partner=t.dataset.partner; drawForm(); return; }
    if(e.target.id==='rdel'){ if(e.target.dataset.sure){ const od=ath(editing._owner).data; od.races=od.races.filter(x=>x.id!==editing.id); save(); closeModal(); render(); } else { e.target.dataset.sure=1; e.target.textContent='Confirmer la suppression'; } return; }
    if(e.target.id==='rsave'){ const r=editing;
      if(!r.name||!r.date||!(+r.km)){ toast('Nom, date et distance sont nécessaires'); return; }
      if(r.goal&&!parseHMS(r.goal)){ toast('Objectif non reconnu : écris par ex. 1:45:00'); return; }
      if(r.duo&&!ath(r.partner)){ toast('Choisis le coéquipier du binôme'); return; } if(r.type!=='swimrun') r.duo=false;
      const od=ath(r._owner).data, clean=Object.assign({},r); delete clean._owner; const i=od.races.findIndex(x=>x.id===r.id); if(i>=0) od.races[i]=clean; else od.races.push(clean);
      save(); closeModal(); render(); toast('Course enregistrée, programme mis à jour'); return; }
  }
  if(modalKind==='block'){
    if(t=e.target.closest('[data-bk]')){ bed.kind=t.dataset.bk; drawBlock(); return; }
    if(e.target.id==='bdel'){ if(e.target.dataset.sure){ S.blocks=S.blocks.filter(x=>x.id!==bed.id); save(); closeModal(); render(); } else { e.target.dataset.sure=1; e.target.textContent='Confirmer la suppression'; } return; }
    if(e.target.id==='bsave'){ if(!bed.from||!bed.to||bed.to<bed.from){ toast('Vérifie les dates'); return; }
      const i=S.blocks.findIndex(x=>x.id===bed.id); if(i>=0) S.blocks[i]=bed; else S.blocks.push(bed); save(); closeModal(); render(); toast('Période enregistrée'); return; }
  }
  // profil
  if(t=e.target.closest('[data-vma]')){ { const sec=Math.round(3600/P.vma)+(+t.dataset.vma); if(sec>=140&&sec<=450) P.vma=3600/sec; } save(); render(); }
  else if(t=e.target.closest('[data-av]')){ const [k,i]=t.dataset.av.split(':'); const a=P.avail[k], n=+i; P.avail[k]=a.includes(n)?a.filter(x=>x!==n):[...a,n].sort(); save(); render(); }
  else if(t=e.target.closest('[data-wmax]')){ P.weekdayMax=+t.dataset.wmax; save(); render(); }
  else if(t=e.target.closest('[data-max]')){ P.maxRun=+t.dataset.max; save(); render(); }
  else if(t=e.target.closest('[data-vm]')){ P.vmaMode=t.dataset.vm; save(); render(); }
  else if(t=e.target.closest('[data-lr]')){ P.lrDay=t.dataset.lr===''?null:+t.dataset.lr; if(P.lrDay!=null&&!P.avail.run.includes(P.lrDay)) P.avail.run=[...P.avail.run,P.lrDay].sort(); save(); render(); }
  else if(t=e.target.closest('[data-sex]')){ P.sex=t.dataset.sex; save(); render(); }
  else if(t=e.target.closest('[data-tog]')){ P[t.dataset.tog]=!P[t.dataset.tog]; save(); render(); }
  else if(t=e.target.closest('[data-pref]')){ const [ty,id]=t.dataset.pref.split('|'); P.prefs=Object.assign({},P.prefs); if(id) P.prefs[ty]=id; else delete P.prefs[ty]; save(); render(); }
  else if(t=e.target.closest('[data-acol]')){ activeAth().color=t.dataset.acol; save(); render(); }
  else if(e.target.id==='adel'){ if(e.target.dataset.sure){ const id=ROOT.active; ROOT.profiles=ROOT.profiles.filter(p=>p.id!==id); ROOT.profiles.forEach(p=>p.data.races.forEach(r=>{ if(r.partner===id){ r.duo=false; r.partner=null; } })); ROOT.active=ROOT.profiles[0].id; refresh(); open.clear(); save(); view='team'; render(); toast('Sportif supprimé'); } else { e.target.dataset.sure=1; e.target.textContent='Confirmer : supprimer '+activeAth().name+' et tout son programme'; } }
  else if(e.target.id==='tapply'){ const a=+$('#t6').value, b=+$('#t12').value; const v=a?a/100:b?b/200:0; if(v>8&&v<26){ P.vma=Math.round(v*100)/100; save(); render(); toast('Allure VMA mise à jour : '+fmtPaceSec(3600/P.vma)+'/km'); } else toast('Saisis une distance en mètres'); }
  else if(e.target.id==='sapply'){ const a=parseHMS($('#s400').value), b=parseHMS($('#s200').value); if(a&&b&&a>b){ P.css=Math.round((a-b)/2); save(); render(); toast('CSS : '+fmtPaceSec(P.css)+'/100 m'); } else toast('Saisis les deux temps, ex. 7:40 et 3:35'); }
  else if(e.target.id==='saHtml'){ SA.saveHtml(); }
  else if(e.target.id==='saLink'){ SA.link(); }
  else if(e.target.id==='saOpen'){ SA.openLinked(); }
  else if(e.target.id==='saResume'){ SA.resume(); }
  else if(e.target.id==='saUnlink'){ SA.unlink(); }
  else if(e.target.id==='saBanner'){ SA.quickSave(); }
  else if(t=e.target.closest('[data-pick]')){ SA.pick(t.dataset.pick); }
  else if(e.target.id==='bkdown'){ flush(); const name='coach-sauvegarde-'+ymd(new Date())+'.json'; const prev=ROOT.lastBackup; ROOT.lastBackup=new Date().toISOString();
    const ok=await offerFile(name,JSON.stringify(Object.assign({app:'coach-course-swimrun',version:3},ROOT),null,1)); if(ok){ save(); render(); toast('Sauvegarde téléchargée'); } else ROOT.lastBackup=prev; }
  else if(e.target.id==='bkok'&&pendingRestore){ setRoot(pendingRestore); pendingRestore=null; open.clear(); lastCore=''; save(); render(); toast('Sauvegarde restaurée'); }
  else if(e.target.id==='bkno'){ pendingRestore=null; $('#bkpreview').innerHTML=''; }
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.k;
  if(k&&modalKind==='race'){ editing[k]=['km','swimKm','dplus','swimSeg','bigRun','bigSwim'].includes(k)?e.target.value.replace(',','.').trim():e.target.value;
    const r=editing; $('#live').innerHTML=r.date&&+r.km?evHTML(EN.evaluate(r),false):''; }
  const bf=e.target.dataset.bf; if(bf&&modalKind==='block') bed[bf]=e.target.value;
  if(e.target.dataset.an&&modalKind==='ath') athDraft.name=e.target.value;
});
document.addEventListener('change',e=>{
  if(e.target.dataset.fc){ const k=e.target.dataset.fc; S.feel[k]=Object.assign({},S.feel[k],{c:e.target.value}); save(); return; }
  if(e.target.id==='bkfile'){ const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{ try{ const o=SA.parseAny(rd.result); if(!(o.profiles||(o.profile&&o.profile.vma))) throw 0; pendingRestore=o; const m=migrate(o);
      $('#bkpreview').innerHTML=`<div class="ev rea" style="margin-top:10px"><b>Sauvegarde du ${o.savedAt?when(o.savedAt):'?'}</b>${m.profiles.length} sportif(s) : ${m.profiles.map(p=>esc(p.name)+' ('+p.data.races.length+' course(s))').join(', ')}. Elle remplacera tous les profils actuels.<div class="row" style="margin-top:8px"><button class="btn sm" id="bkok">Restaurer</button><button class="btn ghost sm" id="bkno">Annuler</button></div></div>`;
    }catch(err){ toast('Fichier de sauvegarde non reconnu'); } }; rd.readAsText(f); return; }
  if(e.target.dataset.aname){ const v=e.target.value.trim(); if(v){ activeAth().name=v; save(); render(); } return; }
  const k=e.target.dataset.p; if(!k) return; const P=S.profile, v=e.target.value.trim();
  if(k==='vma'){ const x=parseHMS(v); if(x&&x>=140&&x<=450) P.vma=3600/x; }
  else if(k==='swim100'||k==='css'){ const s=v?parseHMS(v):null; P[k]= s&&s>40&&s<400?s:null; }
  else P[k]= v?+v:null;
  save(); render();
});

/* ---------- changer de séance ---------- */
let chgKey=null;
function chgSheet(key){
  const s=SESS[key]; if(!s||!s.alts) return; chgKey=key; modalKind='chg';
  const ty=s.swapped?s.swapped.fromType:s.type, canPref=!!EN.PREFS[ty];
  $('#sheet').innerHTML=`<h3>Changer de séance</h3><p class="hint" style="margin-top:0">${s.swapped?'Séance prévue au départ : <b>'+esc(s.swapped.from)+'</b>':'Séance prévue : <b>'+esc(s.title)+'</b>'}. Choisis une alternative qui travaille le même objectif.</p>
  <div class="list">${s.alts.filter(a=>!(s.swapped&&a.id===s.swapped.id)).map(a=>`<button class="card alt" data-alt="${a.id}"><b>${esc(a.l)}</b><span class="small mut">${esc(a.why)}</span></button>`).join('')}
  ${s.swapped?`<button class="card alt" data-alt="keep"><b>↺ Revenir à la séance prévue</b><span class="small mut">${esc(s.swapped.from)}</span></button>`:''}</div>
  ${canPref?`<div class="toggle" style="margin-top:12px"><span class="small">Toujours remplacer les séances « ${esc(ty)} » par ce choix (préférence de ${esc(activeAth().name)})</span><button class="sw" id="chgpref" aria-label="En faire une préférence"></button></div>`:''}
  <div class="row between" style="margin-top:12px"><span></span><button class="btn ghost" data-close="1">Annuler</button></div>`;

/* ---------- sportifs ---------- */
function renderWho(){ const p=activeAth(); $('#who').innerHTML=`<i style="background:${p.color}"></i>${esc(p.name)} ▾`; }
function nextSession(pid){ const e=engineFor(pid,true); const now=new Date(); now.setHours(0,0,0,0);
  for(let i=0;i<21;i++){ const d=addDays(now,i), W=e.buildWeek(mondayOf(d)), ss=W.days[wd(d)].filter(s=>s.cat!=='off'); if(ss.length) return {d,ss}; } return null; }
function teamView(){
  let h=`<div class="row between" style="margin:8px 0 12px"><h2 class="cond" style="margin:0;font-size:26px;text-transform:uppercase">Sportifs</h2>${ROOT.profiles.length<MAXATH?'<button class="btn" data-addath="1">+ Ajouter</button>':''}</div><div class="list">`;
  for(const p of ROOT.profiles){ const e=engineFor(p.id,true); const ns=nextSession(p.id);
    const R=racesFor(p.id).filter(r=>r.date>=TODAY).sort((x,y)=>x.date<y.date?-1:1), g=R.find(r=>r.prio==='A')||R[0];
    const lbl=ns?(ymd(ns.d)===TODAY?"Aujourd'hui":ns.d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric'}))+' : '+ns.ss.map(s=>s.title).join(' + '):'Aucune séance prévue';
    h+=`<button class="card athcard ${p.id===ROOT.active?'on':''}" data-goath="${p.id}"><div class="row"><span class="adot" style="background:${p.color}">${esc(p.name.slice(0,1).toUpperCase())}</span><div style="flex:1;min-width:0;text-align:left"><b class="cond" style="font-size:21px">${esc(p.name)}</b><div class="small mut">VMA ${fmtPaceSec(3600/p.data.profile.vma)}/km <small class="kmh">${v1(p.data.profile.vma)} km/h</small> · ${e.weekCtx(mondayOf(new Date())).phase}</div></div>${p.id===ROOT.active?'<span class="chip">Actif</span>':''}</div>
      <div class="small" style="text-align:left;margin-top:8px">▸ ${esc(lbl)}</div>
      <div class="small mut" style="text-align:left;margin-top:2px">🏁 ${g?esc(g.name)+' · '+parseD(g.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})+' ('+g.prio+')'+(g.duo&&ath(g.partner)?' · binôme':''):'Pas de course prévue'}</div></button>`; }
  return h+`</div><p class="hint">Touche un sportif pour afficher son programme. Ses réglages se modifient dans l'onglet Profil.</p>`;
}

/* ---------- guide ---------- */
function guideView(){

async function sendToWatch(kind,key){
  const s=SESS[key]; if(!s||!s.wk) return;
  const dk=key.split('|')[0], d=parseD(dk);
  const clean=s.title.replace(/[·×'"\/:*?<>|]/g,' ').replace(/\s+/g,' ').trim();
  const who=ROOT.profiles.length>1?activeAth().name:''; const base=(who?who+' ':'')+dk+' '+clean, name=pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+' '+s.title+(who?' ('+who+')':'');
  let data, ext;
  try{ if(kind==='apple'){ data=encAppleWorkout(name,s.wk); ext='.workout'; } else { data=encGarminFit(name,s.wk); ext='.fit'; } }
  catch(err){ toast('Impossible de créer le fichier pour cette séance'); return; }
  const ok=STANDALONE? await offerFile(base+ext,data) : await offerFile(base+(kind==='apple'?' Apple':' Garmin')+'.zip',makeZip([{name:base+ext,data}]));
  if(ok&&STANDALONE) toast(kind==='apple'?'Fichier .workout téléchargé : envoie-le-toi par Messages':'Fichier .fit téléchargé'); else if(ok) toast(kind==='apple'?'Ouvre le zip dans Fichiers, puis touche le fichier .workout':'Dézippe dans Fichiers, puis importe le .fit dans intervals.icu');
}

/* ---------- PDF ---------- */
function pdfTxt(s){ return String(s).replace(/‹([^›]*)›/g,'($1)').replace(/🏁\s*/g,'').replace(/→/g,'>').replace(/≈/g,'~').replace(/−/g,'-').replace(/[^\x00-\xFF–—’‘“”•…]/g,''); }
async function exportPDF(start,nMonths){
  if(!window.jspdf){ toast('Module PDF indisponible, réessaie dans un instant'); return; }
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'}); const P=S.profile, g=nextGoal();
  const COL={swim:[28,124,147],renfo:[122,92,158],race:[150,110,0],off:[120,120,120],run:[190,64,28]};
  for(let k=0;k<nMonths;k++){
    const m=new Date(start.getFullYear(),start.getMonth()+k,1), M=MONTHS[m.getMonth()]+' '+m.getFullYear();
    if(k) doc.addPage();
    doc.setFillColor(22,24,29); doc.rect(0,0,210,24,'F'); doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(17);
    doc.text(pdfTxt('PROGRAMME — '+M.toUpperCase()+(ROOT.profiles.length>1?' — '+activeAth().name.toUpperCase():'')),12,11);
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    doc.text(pdfTxt('Allure VMA '+fmtPaceSec(3600/P.vma)+'/km · EF '+EN.hr(65)+'-'+EN.hr(75)+' bpm · FC max '+EN.hrMax()+' · CSS '+fmtPaceSec(EN.css())+'/100 m'+(g?' · Objectif : '+g.name+' ('+g.prio+') le '+parseD(g.date).toLocaleDateString('fr-FR'):'')),12,18);
    doc.setTextColor(0);
    const body=[];
    for(const ws of monthWeeks(m)){
      const W=EN.buildWeek(ws), c=W.ctx;
      body.push([{content:pdfTxt('Semaine du '+ws.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})+'  ·  '+c.phase+'  ·  fractionné '+c.mode+(P.mixWeek?' + '+(c.mode==='piste'?'route':'piste'):'')+(c.target?'  ·  '+c.target.name+' J-'+Math.round((parseD(c.target.date)-ws)/864e5):'')),colSpan:3,styles:{fillColor:[238,234,226],fontStyle:'bold',textColor:[22,24,29]}}]);
      for(let i=0;i<7;i++){ const d=addDays(ws,i); if(d.getMonth()!==m.getMonth()) continue; const ss=W.days[i], lab=DSHORT[i]+' '+d.getDate();
        if(!ss.length){ body.push([lab,{content:'Repos',styles:{textColor:[140,140,140]}},'']); continue; }
        ss.forEach((s,j)=>body.push([j?'':lab,{content:pdfTxt(s.title+'\n'+s.sum+(s.dur?' · ~'+fmtMin(s.dur):'')),styles:{fontStyle:'bold',textColor:COL[s.cat]||COL.run}},pdfTxt(s.blocks.map(b=>b.h+' : '+b.l.join(' / ')).join('\n'))]));
      }
    }
    doc.autoTable({startY:30,head:[['Jour','Séance','Détail'].map(pdfTxt)],body,theme:'grid',
      styles:{fontSize:8,cellPadding:1.8,valign:'top',lineColor:[220,216,208],lineWidth:.2},headStyles:{fillColor:[226,85,43],textColor:255},
      columnStyles:{0:{cellWidth:15,fontStyle:'bold'},1:{cellWidth:48},2:{cellWidth:'auto'}},margin:{left:10,right:10,top:12}});
  }
  const zones=[['Récupération',60,65],['Endurance fondamentale',65,75],['Endurance active',75,82],['Seuil',83,88],['VMA longue',90,95],['VMA courte',100,105]];
  let y=doc.lastAutoTable.finalY+8; if(y>240){ doc.addPage(); y=16; }
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Mes zones',10,y);
  doc.autoTable({startY:y+3,head:[['Zone','% VMA','Allure /km','FC']],body:zones.map(([n,a,b])=>[n,a+'-'+b,fmtPaceSec(3600/EN.kmh(a))+' - '+fmtPaceSec(3600/EN.kmh(b))+'  ('+v1(EN.kmh(a))+'-'+v1(EN.kmh(b))+' km/h)',b<=92?EN.hr(a)+'-'+EN.hr(b):'-']).map(r=>r.map(pdfTxt)),
    theme:'grid',styles:{fontSize:8.5,cellPadding:1.6},headStyles:{fillColor:[22,24,29]},margin:{left:10,right:10}});
  const n=doc.getNumberOfPages(); for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(7.5); doc.setTextColor(130); doc.text(pdfTxt('Coach Course & Swimrun · page '+i+'/'+n),10,290); }
  const end=new Date(start.getFullYear(),start.getMonth()+nMonths-1,1);
  const tag=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1);
  const name='Programme-'+(ROOT.profiles.length>1?activeAth().name.replace(/[^\wÀ-ÿ-]/g,'')+'-':'')+tag(start)+(nMonths>1?'_'+tag(end):'')+'.pdf';
  const blob=doc.output('blob');
  let dl=null; try{ if(typeof claude!=='undefined') dl=await claude.use('downloads'); }catch(e){}
  if(dl){ try{ await dl.save({filename:name,data:blob}); toast('PDF prêt : '+name); }catch(err){ if(!(err&&err.code==='declined')) toast('Export impossible ici. Ouvre l\'appli dans claude.ai pour télécharger le PDF.'); } }
  else { try{ doc.save(name); }catch(e){ toast('Export indisponible dans cette vue'); } }
}

/* ---------- version autonome : sauvegardes ---------- */
const SA=(()=>{
  const FS=typeof window.showSaveFilePicker==='function';
  let handle=null, perm=false, lastWrite=null, pending=null, embedded=null;
  const coreOf=o=>JSON.stringify(Object.assign({},o,{savedAt:null,lastBackup:null,active:null}));
  const hash=s=>{ let h=5381; for(let i=0;i<s.length;i++) h=((h*33)^s.charCodeAt(i))>>>0; return h.toString(36); };
  const savedHash=()=>{ try{ return localStorage.getItem('coach-saved-hash'); }catch(e){ return null; } };
  const markSaved=()=>{ try{ localStorage.setItem('coach-saved-hash',hash(coreOf(ROOT))); }catch(e){} };
  const dirty=()=>ROOT&&hash(coreOf(ROOT))!==savedHash();
  const stamp=()=>{ const d=new Date(); return ymd(d)+'-'+pad2(d.getHours())+pad2(d.getMinutes()); };
  function extract(text){ const m=text.match(/<script type="application\/json" id="embedded-data">([\s\S]*?)<\/script>/); if(!m) return null; const t=m[1].trim(); return t&&t!=='null'?JSON.parse(t):null; }
  function parseAny(text){ text=String(text).trim(); if(text[0]==='<'){ const o=extract(text); if(!o) throw 0; return o; } return JSON.parse(text); }
  // IndexedDB pour garder le lien vers le fichier
  const idb=(mode,fn)=>new Promise((res,rej)=>{ try{ const r=indexedDB.open('coach-fs',1); r.onupgradeneeded=()=>r.result.createObjectStore('h'); r.onsuccess=()=>{ const tx=r.result.transaction('h',mode); const st=tx.objectStore('h'); const q=fn(st); tx.oncomplete=()=>res(q&&q.result); tx.onerror=()=>rej(tx.error); }; r.onerror=()=>rej(r.error); }catch(e){ rej(e); } });
  const putH=h=>idb('readwrite',st=>st.put(h,'file')).catch(()=>{});
  const getH=()=>idb('readonly',st=>st.get('file')).catch(()=>null);
  const delH=()=>idb('readwrite',st=>st.delete('file')).catch(()=>{});
  async function writeFile(){ if(!handle||!perm) return false; try{ const w=await handle.createWritable(); await w.write(JSON.stringify(Object.assign({app:'coach-course-swimrun',version:3},ROOT),null,1)); await w.close(); lastWrite=new Date(); markSaved(); banner(); return true; }catch(e){ perm=false; banner(); return false; } }
  let wT=null;
  function changed(){ if(handle&&perm){ clearTimeout(wT); wT=setTimeout(writeFile,800); } banner(); }
  function banner(){
    let el=document.getElementById('sabar'); if(!el){ el=document.createElement('div'); el.id='sabar'; el.className='sabar'; document.body.prepend(el); }
    if(handle&&!perm){ el.innerHTML=`<span>Enregistrement automatique en pause</span><button id="saResume">Reprendre</button>`; el.style.display='flex'; return; }
    if(dirty()&&!(handle&&perm)){ el.innerHTML=`<span>Modifications non sauvegardées</span><button id="saBanner">Sauvegarder</button>`; el.style.display='flex'; return; }
    el.style.display='none';
  }
  function saveHtml(){
    flush(); ROOT.lastBackup=new Date().toISOString(); lastCore='';
    const json=JSON.stringify(ROOT).replace(/</g,'\\u003c');
    const html=PRISTINE.replace(/(<script type="application\/json" id="embedded-data">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);
    if(directDownload('Coach-Course-Swimrun-'+stamp()+'.html',new Blob([html],{type:'text/html'}))){ markSaved(); flush(); banner(); render(); toast('Appli + données enregistrées : garde ce fichier, c\'est ta sauvegarde'); }
  }
  function quickSave(){ if(handle&&perm) writeFile(); else saveHtml(); }
  async function link(){ try{ const h=await window.showSaveFilePicker({suggestedName:'coach-donnees.json',types:[{description:'Données Coach',accept:{'application/json':['.json']}}]}); handle=h; perm=true; await putH(h); await writeFile(); render(); toast('Enregistrement automatique activé dans '+h.name); }catch(e){ if(e&&e.name!=='AbortError') toast('Impossible de lier ce fichier'); } }
  async function openLinked(){ try{ const [h]=await window.showOpenFilePicker({types:[{description:'Données Coach',accept:{'application/json':['.json']}}]}); const f=await h.getFile(); const o=parseAny(await f.text());
      handle=h; perm=(await h.requestPermission({mode:'readwrite'}))==='granted'; await putH(h); compare(o,'Fichier '+h.name); render(); }catch(e){ if(e&&e.name!=='AbortError') toast('Fichier non reconnu'); } }
  async function resume(){ if(!handle) return; try{ perm=(await handle.requestPermission({mode:'readwrite'}))==='granted'; if(perm){ const f=await handle.getFile(); const txt=await f.text(); let o=null; try{ o=parseAny(txt); }catch(e){} if(o&&coreOf(migrate(o))!==coreOf(ROOT)) compare(o,'Fichier '+handle.name); else await writeFile(); } }catch(e){} banner(); render(); }
  async function unlink(){ handle=null; perm=false; await delH(); banner(); render(); toast('Enregistrement automatique désactivé'); }
  function compare(o,label){
    const fileRoot=migrate(o); if(coreOf(fileRoot)===coreOf(ROOT)){ if(handle&&perm) writeFile(); else markSaved(); banner(); return; }
    pending={o,label};
    const fd=o.savedAt?when(o.savedAt)+' ('+new Date(o.savedAt).toLocaleDateString('fr-FR')+')':'date inconnue', bd=ROOT.savedAt?when(ROOT.savedAt)+' ('+new Date(ROOT.savedAt).toLocaleDateString('fr-FR')+')':'date inconnue';
    const newer=(o.savedAt||'')>(ROOT.savedAt||'')?'file':'browser';
    modalKind='pick';
    $('#sheet').innerHTML=`<h3>Deux versions différentes</h3><p class="small">Les données de ce navigateur ne sont pas les mêmes que celles du fichier. Laquelle garder ?</p>
    <div class="list"><button class="card alt" data-pick="file"><b>${esc(label)}${newer==='file'?' · plus récent':''}</b><span class="small mut">Enregistré le ${fd} · ${fileRoot.profiles.length} sportif(s)</span></button>
    <button class="card alt" data-pick="browser"><b>Ce navigateur${newer==='browser'?' · plus récent':''}</b><span class="small mut">Enregistré le ${bd} · ${ROOT.profiles.length} sportif(s)</span></button></div>
    <p class="hint">La version non choisie sera remplacée.</p>`;
    $('#modal').classList.add('show');
  }
  function pick(which){ if(!pending) return; if(which==='file'){ setRoot(pending.o); try{ localStorage.setItem('coach-state',JSON.stringify(ROOT)); lastJson=JSON.stringify(ROOT); }catch(e){} markSaved(); if(handle&&perm) writeFile(); }
    else { if(handle&&perm) writeFile(); }
    pending=null; closeModal(); render(); banner(); }
  let had=false;
  function boot(){ try{ had=!!localStorage.getItem('coach-state'); }catch(e){} try{ embedded=extract(PRISTINE); }catch(e){ embedded=null; }
    if(embedded&&!ROOT){ setRoot(embedded); markSaved(); try{ localStorage.setItem('coach-state',JSON.stringify(ROOT)); }catch(e){} embedded=null; } }
  async function afterBoot(){
    if(!had&&!embedded&&savedHash()===null) markSaved();
    if(embedded){ compare(embedded,'Fichier HTML ouvert'); embedded=null; }
    if(FS){ const h=await getH(); if(h){ handle=h; try{ perm=(await h.queryPermission({mode:'readwrite'}))==='granted'; }catch(e){ perm=false; } if(perm){ try{ const o=parseAny(await (await h.getFile()).text()); if(coreOf(migrate(o))!==coreOf(ROOT)&&!pending) compare(o,'Fichier '+h.name); }catch(e){} } } }
    window.addEventListener('beforeunload',e=>{ flush(); if(dirty()&&!(handle&&perm)){ e.preventDefault(); e.returnValue=''; } });
    banner(); if(view==='prof') render();
  }
  function panel(){
    return `<div class="sapanel"><h4 class="cond" style="font-size:18px;margin:14px 0 6px;text-transform:uppercase">Version autonome</h4>
    <p class="small" style="margin:0 0 8px">Les données de ce navigateur s'effacent si tu vides l'historique. Garde toujours une sauvegarde à jour.</p>
    <button class="btn sm" id="saHtml">Enregistrer l'appli + mes données (.html)</button>
    <p class="hint">Crée un fichier HTML complet avec tes données à l'intérieur. Ouvre-le plus tard : tout est là, même navigateur vidé. C'est aussi un fichier de restauration valable.</p>
    ${FS?(handle?`<p class="small" style="margin:10px 0 6px">Enregistrement automatique : <b>${esc(handle.name)}</b> ${perm?'· actif'+(lastWrite?' (dernier : '+lastWrite.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+')':''):'· en pause'}</p>
      <div class="row" style="flex-wrap:wrap">${perm?'':'<button class="btn sm" id="saResume">Reprendre</button>'}<button class="btn ghost sm" id="saUnlink">Désactiver</button></div>`
      :`<div class="row" style="flex-wrap:wrap;margin-top:10px"><button class="btn ghost sm" id="saLink">Activer l'enregistrement automatique</button><button class="btn ghost sm" id="saOpen">Ouvrir un fichier lié</button></div>
      <p class="hint">Chrome / Edge : choisis un fichier (ex. dans Documents) où l'appli écrit à chaque modification. Après un nettoyage du navigateur, « Ouvrir un fichier lié » recharge tout depuis ce fichier.</p>`)
      :`<p class="hint">Ce navigateur ne permet pas l'enregistrement automatique dans un fichier (seuls Chrome et Edge sur ordinateur le font). Utilise l'enregistrement .html ci-dessus.</p>`}</div>`;
  }
  return {changed,banner,saveHtml,quickSave,link,openLinked,resume,unlink,pick,boot,afterBoot,panel,parseAny};
})();

/* ---------- démarrage ---------- */
loadLocal(); if(STANDALONE) SA.boot(); if(!ROOT) setRoot({}); render(); initSync(); if(STANDALONE) SA.afterBoot();

</script>
</body>
</html>
