function wbSession(E,w){ const d=wbDescribe(E,w);
  return {cat:'run',type:'Perso',title:'⌚ '+w.name,sum:'Séance perso · ≈ '+String(Math.round(d.km*10)/10).replace('.',',')+' km d\'effort',dur:d.dur,custom:true,wk:wbToWk(E,w),blocks:[{h:'Séance perso',l:d.lines}]}; }
function wkToWb(name,wk){
  const w=wbNew(); w.name=name.replace(/^⌚ /,''); w.blocks=[];
  const g2=x=>x&&x.g?(x.g[0]==='time'?{t:'time',v:Math.round(x.g[1]/60)}:{t:'open',v:10}):{t:'open',v:10};
  w.warm=wk.warm?g2(wk.warmStep):{t:'none',v:0}; w.cool=(wk.coolStep||(wk.warm&&wk.cool!==false))?g2(wk.coolStep):{t:'none',v:0};
  const zoneOf=hr=>{ let best='ef',d=1e9; for(const [k,z] of Object.entries(ZONES)){ const x=Math.abs(EN.hr(z[1])-hr[0]); if(x<d){d=x;best=k;} } return best; };
  for(const B of wk.blocks){
    if(B.steps.length===1&&B.steps[0].p==='rec'){ w.blocks.push({kind:'rest',rec:{g:'time',v:B.steps[0].g[0]==='time'?B.steps[0].g[1]:60}}); continue; }
    const works=B.steps.filter(s=>s.p==='work'), rec=B.steps.find(s=>s.p==='rec');
    for(const s of works){ const wo={g:s.g[0]==='dist'?'dist':'time',v:s.g[1],tgt:'none',tv:90,z:'seuil'};
      if(s.pace){ wo.tgt='pace'; wo.tv=Math.round(s.pace); } else if(s.hr){ wo.tgt='zone'; wo.z=zoneOf(s.hr); }
      w.blocks.push({kind:'rep',iter:works.length>1?1:B.iter,work:wo,rec:rec&&works.length===1?{g:rec.g[0],v:rec.g[1]}:{g:'none',v:0}}); }
  }
  // regroupe « bloc + pause + même bloc » en séries
  const same=(x,y)=>x&&y&&x.kind==='rep'&&y.kind==='rep'&&JSON.stringify([x.iter,x.work,x.rec])===JSON.stringify([y.iter,y.work,y.rec]);
  for(let i=0;i<w.blocks.length-2;i++){ const a=w.blocks[i];
    while(w.blocks[i+1]&&w.blocks[i+1].kind==='rest'&&same(a,w.blocks[i+2])){ a.series=(+a.series||1)+1; a.sr=w.blocks[i+1].rec.v; w.blocks.splice(i+1,2); } }
  if(!w.blocks.length) w.blocks.push(REP(1,'time',1800,'zone',0,null,0,'ef'));
  return w;
}

/* ---- saisie rapide (notation de club) ---- */
function autoName(blocks){ const f=w=>w.g==='time'?fmtSec(+w.v):(+w.v>=1000?String(+w.v/1000).replace('.',',')+' km':w.v+' m');
  const parts=blocks.filter(b=>b.kind==='rep'&&!(b.iter===1&&b.work.tgt==='zone'&&b.work.z==='ef')).map(b=>((+b.series||1)>1?b.series+' × ':'')+(b.iter>1?b.iter+' × ':'')+f(b.work));
  return (parts.join(' + ')||'Séance').slice(0,40); }
const ZKEY={ef:'ef',endurance:'ef',z2:'ef',active:'active',ea:'active',z3:'active',seuil:'seuil',z4:'seuil',as:'seuil'};
function qTime(s){ s=s.trim(); let m;
  if(m=s.match(/^(\d+)h(\d{1,2})?$/)) return (+m[1])*3600+(+(m[2]||0))*60;
  if(m=s.match(/^(\d+)(?:'|’|min|mn)(\d{1,2})?(?:"|s)?$/)) return (+m[1])*60+(+(m[2]||0));
  if(m=s.match(/^(\d+):(\d{2})$/)) return (+m[1])*60+(+m[2]);
  if(m=s.match(/^(\d+)(?:"|s|sec)$/)) return +m[1];
  return null; }
function qDist(s){ s=s.trim(); let m;
  if(m=s.match(/^(\d+(?:[.,]\d+)?)\s*km$/)) return Math.round(parseFloat(m[1].replace(',','.'))*1000);
  if(m=s.match(/^(\d+)\s*m$/)) return +m[1];
  if(m=s.match(/^(\d{3,5})$/)) return +m[1];
  return null; }
function qEffort(s){ const t=qTime(s); if(t!=null) return {g:'time',v:t}; const d=qDist(s); if(d!=null) return {g:'dist',v:d}; const m=s.match(/^(\d{1,2})$/); if(m) return {g:'time',v:+m[1]}; return null; }
function qTarget(s){ s=s.trim().replace(/\s+/g,''); let m;
  if(m=s.match(/^(\d{2,3})%?(?:vma)?$/)) { if(+m[1]>=50&&+m[1]<=120) return {tgt:'pct',tv:+m[1]}; }
  if(m=s.match(/^(\d)(?:'|’|:)(\d{2})(?:"|\/km)?(?:\/km)?$/)) return {tgt:'pace',tv:(+m[1])*60+(+m[2])};
  const z=ZKEY[s]; if(z) return {tgt:'zone',z};
  return null; }
function qRec(s){ s=s.trim(); if(/^(libre|open|lib)$/.test(s)) return {g:'open',v:0}; const t=qTime(s); if(t!=null) return {g:'time',v:t}; const d=qDist(s); if(d!=null) return {g:'dist',v:d}; const m=s.match(/^(\d{1,2})$/); if(m) return {g:'time',v:+m[1]}; return null; }
function quickParse(text){
  const out={blocks:[],warm:null,cool:null,errors:[]};
  let src=text.toLowerCase().replace(/×/g,'x').replace(/[’‘]/g,"'").replace(/[″”“]/g,'"').replace(/récup|recup|rec\b/g,'r').replace(/r\s+(?=\d|libre)/g,'r').replace(/@\s+/g,'@');
  const segs=[]; let depth=0, cur='';
  for(const ch of src){ if(ch==='(') depth++; if(ch===')') depth--; if(depth===0&&/[+;\n]/.test(ch)){ segs.push(cur); cur=''; } else cur+=ch; } segs.push(cur);
  for(let seg of segs){ seg=seg.trim(); if(!seg) continue; const orig=seg; let m;
    if(m=seg.match(/^(?:échauf\w*|echauf\w*|écha|echa|wu)\s*:?\s*(\S+)/)){ const t=qTime(m[1]); if(/libre/.test(m[1])) out.warm={t:'open',v:15}; else if(t) out.warm={t:'time',v:Math.round(t/60)}; else out.errors.push(orig); continue; }
    if(m=seg.match(/^(?:rac|retour\w*(?:\s+au\s+calme)?|cd)\s*:?\s*(\S+)/)){ const t=qTime(m[1]); if(/libre/.test(m[1])) out.cool={t:'open',v:10}; else if(t) out.cool={t:'time',v:Math.round(t/60)}; else out.errors.push(orig); continue; }
    // séries : 2x( ... ) R3'
    let series=1, sr=0;
    if(m=seg.match(/^(\d+)\s*x\s*\((.+)\)\s*(.*)$/)){ series=+m[1]; let rest=m[3].trim(); seg=m[2].trim();
      const r=rest.match(/r\s*(\S+)/); if(r){ const t=qTime(r[1]); if(t) sr=t; }
      const tg=rest.match(/@(\S+)/); if(tg&&!/@/.test(seg)) seg+=' @'+tg[1]; }
    // n x effort[/rec] [@cible] [r rec]
    if(series===1&&(m=seg.match(/^(\d+)\s*x\s*(\d+)\s*x\s*(.+)$/))){ series=+m[1]; seg=m[2]+'x'+m[3]; const r=seg.match(/\bR(\S+)/i); }
    if(series>1&&!sr){ const all=[...seg.matchAll(/(?:^|\s)r(\d\S*)/g)]; if(all.length>=2){ const L=all[all.length-1]; const t=qTime(L[1]); if(t){ sr=t; seg=seg.slice(0,L.index)+seg.slice(L.index+L[0].length); } } }
    let n=1; if(m=seg.match(/^(\d+)\s*x\s*(.+)$/)){ n=+m[1]; seg=m[2]; }
    let tgt=null, rec=null;
    const tm_=seg.match(/@(\S+)/); if(tm_){ tgt=qTarget(tm_[1]); if(!tgt){ out.errors.push(orig); continue; } seg=seg.replace(tm_[0],' '); }
    const zw=seg.match(/\b(ef|endurance|active|seuil)\b/); if(zw&&!tgt){ tgt={tgt:'zone',z:ZKEY[zw[1]]}; seg=seg.replace(zw[0],' '); }
    const rm=seg.match(/(?:^|\s)r(\S+)/); if(rm){ rec=qRec(rm[1]); if(!rec){ out.errors.push(orig); continue; } seg=seg.replace(rm[0],' '); }
    seg=seg.trim(); let eff=null;
    const py=seg.split(/\s+/)[0]; if(/^[^-\s]+(-[^-\s]+)+$/.test(py)){ const parts=py.split('-').map(qEffort); if(parts.some(p=>!p)){ out.errors.push(orig); continue; }
      parts.forEach((p,i)=>out.blocks.push({kind:'rep',iter:n,work:Object.assign({g:p.g,v:p.v,tgt:'none',tv:90,z:'seuil'},tgt||{}),rec:i<parts.length-1?(rec||{g:'none',v:0}):{g:'none',v:0}})); continue; }
    const sl=seg.match(/^(\S+?)\/(\S+)$/);
    if(sl){ eff=qEffort(sl[1]); const r2=qRec(sl[2]); if(r2) rec=r2; }
    else eff=qEffort(seg.split(/\s+/)[0]||'');
    if(!eff){ out.errors.push(orig); continue; }
    const blk={kind:'rep',iter:n,work:Object.assign({g:eff.g,v:eff.v,tgt:'none',tv:90,z:'seuil'},tgt||{}),rec:rec||{g:'none',v:0}};
    if(series>1){ blk.series=series; blk.sr=sr; }
    if(blk.series>1&&blk.iter===1&&!blk.sr){ blk.iter=blk.series; delete blk.series; delete blk.sr; }
    out.blocks.push(blk);
  }
  return out;
}

function purgeOld(o){ if(!o||typeof o!=='object') return o; const lim=ymd(addDays(new Date(),-61)); const old=k=>String(k).slice(0,10)<lim;
  for(const f of ['done','feel','moves','swaps']) if(o[f]&&typeof o[f]==='object') for(const k of Object.keys(o[f])) if(old(k)) delete o[f][k];
  if(Array.isArray(o.customs)) o.customs=o.customs.filter(c=>!c.date||c.date>=lim);

const CLUBC=new Map(), RAWE=new Map();
function rawEng(pid){ if(!RAWE.has(pid)) RAWE.set(pid,memoEngine(engineFor(pid,false))); return RAWE.get(pid); }
function clubThemes(ws){ const k=ymd(ws); if(CLUBC.has(k)) return CLUBC.get(k); CLUBC.set(k,{});
  const per={};
  for(const p of ROOT.profiles){ if(p.data.profile.noClub) continue; let W; try{ W=rawEng(p.id).buildWeek(ws); }catch(e){ continue; }
    for(const [d,q] of Object.entries(W.qRaw||{})) if(q.flex) (per[d]=per[d]||[]).push(Object.assign({pid:p.id},q)); }
  const res={}, order=['VMAC','VMAL','SEUIL','COTES'], iw=isoWeek(ws), rot=order.map((_,i)=>order[(i+iw)%4]);
  for(const [d,L] of Object.entries(per)){ if(L.length<2) continue; const cnt={}; L.forEach(x=>cnt[x.k]=(cnt[x.k]||0)+1);
    const kk=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||rot.indexOf(a)-rot.indexOf(b))[0];
    const route=L.filter(x=>x.m==='route').length;
    res[d]={k:kk,m:route*2>L.length?'route':'piste',i:iw,who:L.map(x=>x.pid)}; }
  CLUBC.set(k,res); return res; }
function clubFor(pid){ return ws=>{ if(!ROOT||ROOT.profiles.length<2) return null; const T=clubThemes(ws), out={};
  for(const [d,t] of Object.entries(T)){ if(!t.who.includes(pid)) continue; out[d]={k:t.k,m:t.m,i:t.i,with:t.who.filter(x=>x!==pid).map(x=>(ath(x)||{}).name).filter(Boolean)}; }
  return out; }; }

function alsoIn(r,pid){ return ROOT.profiles.filter(p=>p.id!==pid&&p.id!==r.partner&&p.id!==r._owner&&p.data.races.some(x=>sameRace(x,r))); }

/* ---- actions ---- */
let gImport=null;
async function groupClick(e){ let t;
  if(t=e.target.closest('[data-gact]')){ const a=t.dataset.gact;
    if(a==='reload'){ location.reload(); }
    else if(a==='solo'){ GATE=false; render(); }
    else if(a==='admin'){ lsSet('coach-admin','1'); location.hash=''; location.reload(); }
    else if(a==='quitadmin'){ lsSet('coach-admin',null); location.hash=''; location.reload(); }
    else if(a==='paste'){ const v=($('#gpaste')||{}).value||''; const m=v.match(/k=([A-Za-z0-9]{20,})/)||v.trim().match(/^([A-Za-z0-9]{20,})$/); if(!m){ toast('Lien non reconnu : copie-le en entier'); return true; }
      lsSet('coach-admin',null); lsSet('coach-key',m[1]); location.hash='k='+m[1]; location.reload(); }
    else if(a==='login'){ gLogin(); }
    else if(a==='logout'){ try{ await G.F.signOut(G.auth); }catch(e){} lsSet('coach-admin',null); lsSet(gCacheKey(),null); location.hash=''; location.reload(); }
    else if(a==='leave'){ if(!t.dataset.sure){ t.dataset.sure=1; t.textContent='Confirmer : il faudra rouvrir ton lien personnel'; return true; } flush(); lsSet('coach-key',null); lsSet(gCacheKey(),null); location.hash=''; location.reload(); }
    else if(a==='mylink'){ const p=activeAth(); copyText(gLink(p),'Lien copié : colle-le dans Safari ou Chrome sur l\'autre appareil'); }
    else if(a==='myback'){ flush(); const p=activeAth(); await offerFile('coach-'+p.name.replace(/[^\wÀ-ÿ-]/g,'')+'-'+ymd(new Date())+'.json',JSON.stringify({app:'coach-course-swimrun',version:3,profiles:[{id:p.id,name:p.name,color:p.color,data:p.data}],active:p.id,savedAt:new Date().toISOString()},null,1)); }
    else if(a==='export'){ gExport(); }
    else if(a==='implocal'){ try{ gPrepImport(JSON.parse(lsGet('coach-state')),'Profils de cet appareil'); }catch(e){ toast('Aucune donnée locale lisible'); } }
    else if(a==='doimport'){ gDoImport(); }
    else if(a==='first'){ const nm=(($('#gfirst')||{}).value||'').trim(); if(!nm){ toast('Indique un prénom'); return true; }
      const p={id:'p'+Date.now(),name:nm,color:COLORS[0],data:mergeAth({})}; gMarkNew(p); GATE=false; gAssemble(); refresh(); lastCore=''; save(); view='prof'; render(); toast(nm+' créé·e : complète son profil'); }
    return true; }
  if(t=e.target.closest('[data-glink]')){ const p=ath(t.dataset.glink); if(!p||!p.key){ toast('Lien en cours de création, réessaie'); return true; } flush();
    const url=gLink(p), txt=p.name+', voici ton lien personnel pour ton programme d\'entraînement. Ouvre-le puis ajoute-le à l\'écran d\'accueil. Garde-le pour toi.';
    if(navigator.share){ try{ await navigator.share({title:'Coach Course',text:txt,url}); }catch(err){ if(!(err&&err.name==='AbortError')) copyText(url,'Lien copié'); } } else copyText(url,'Lien de '+p.name+' copié');
    return true; }
  if(t=e.target.closest('[data-gcopy]')){ const p=ath(t.dataset.gcopy); if(p&&p.key){ flush(); copyText(gLink(p),'Lien de '+p.name+' copié'); } return true; }
  if(t=e.target.closest('[data-gregen]')){ const p=ath(t.dataset.gregen); if(!p) return true;
    if(!t.dataset.sure){ t.dataset.sure=1; t.textContent='Confirmer : l\'ancien lien ne marchera plus'; return true; }
    if(p.key&&G.known[p.id]) G.rekey[p.id]=p.key; p.key=rid(28); G.known[p.id]=p.key; lastCore=''; save(); render(); toast('Nouveau lien créé pour '+p.name+' : envoie-le-lui'); return true; }
  return false; }
document.addEventListener('change',e=>{ if(e.target.id!=='gimpfile') return; const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ gPrepImport(SA.parseAny(rd.result),f.name); }catch(err){ toast('Fichier non reconnu'); } }; rd.readAsText(f); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.target.id==='gpass'||e.target.id==='gmail')) gLogin(); });
function copyText(t,msg){ const ok=()=>toast(msg||'Copié'); if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok,()=>showText(t)); else showText(t); }
function showText(t){ modalKind='txt'; $('#sheet').innerHTML=`<h3>Lien</h3><p class="small mut">Sélectionne et copie :</p><textarea class="inp" style="height:90px" readonly onclick="this.select()">${esc(t)}</textarea><div class="row" style="margin-top:12px"><button class="btn" data-close="1">Fermer</button></div>`; $('#modal').classList.add('show'); }

function gExport(){ flush(); const now=new Date().toISOString();
  const o={app:'coach-course-swimrun',version:3,club:true,savedAt:now,active:ROOT.active,settings:ROOT.settings,profiles:editables().map(p=>({id:p.id,name:p.name,color:p.color,key:p.key,data:p.data}))};
  offerFile('club-coach-sauvegarde-'+ymd(new Date())+'.json',JSON.stringify(o,null,1)).then(ok=>{ if(ok&&G.db){ G.club.lastBackup=now; G.F.setDoc(G.F.doc(G.db,'club','meta'),{lastBackup:now},{merge:true}).catch(()=>{}); render(); toast('Sauvegarde du club téléchargée'); } }); }
function gPrepImport(o,label){
  const raw=(o&&Array.isArray(o.profiles))?o.profiles:null, m=migrate(o); const keys={}; if(raw) raw.forEach(p=>{ if(p&&p.id&&p.key) keys[String(p.id)]=p.key; });
  const list=m.profiles.map(p=>Object.assign({},p,{key:keys[p.id]||null}));
  const rep=list.filter(q=>{ const x=ath(q.id); return x&&!x.ro&&x.name===q.name; }).length, add=list.length-rep;
  if(editables().length+add>MAXATH){ toast('Trop de sportifs : '+MAXATH+' maximum'); return; }
  gImport={list,label};
  const box=GATE?null:$('#gimpbox'); const html=`<div class="ev att" style="margin-top:10px"><b>${esc(label)} : ${list.length} sportif(s)</b>${list.map(q=>esc(q.name)).join(', ')}<br>${rep?rep+' remplacé(s) (même prénom), ':''}${add} ajouté(s).<div class="row" style="margin-top:8px"><button class="btn sm" data-gact="doimport">Importer</button></div></div>`;
  if(box) box.innerHTML=html; else { modalKind='txt'; $('#sheet').innerHTML='<h3>Importer</h3>'+html; $('#modal').classList.add('show'); } }
function gDoImport(){ if(!gImport) return; const L=gImport.list; gImport=null; const remap={}; const taken=new Set(Object.values(G.full).map(p=>p.key));
  for(const q of L){ const x=ath(q.id);
    if(x&&!x.ro&&x.name===q.name){ x.data=q.data; x.color=q.color; continue; }
    let id=q.id; if(ath(id)||G.full[id]){ id='p'+Date.now()+Math.floor(Math.random()*1000); remap[q.id]=id; }
    const p={id,name:q.name,color:q.color,data:q.data}; if(q.key&&!taken.has(q.key)) p.key=q.key; gMarkNew(p); }
  for(const p of Object.values(G.full)) (p.data.races||[]).forEach(r=>{ if(r.partner&&remap[r.partner]) r.partner=remap[r.partner]; });
  closeModal(); GATE=false; gAssemble(); refresh(); lastCore=''; save(); view='admin'; render(); toast('Import terminé'); }

/* ---- données ---- */
const ENGK=['vma','age','sex','level','avail','lrDay','maxRun','weekdayMax','vmaMode','mixWeek','swimAllYear','swim100','css','noClub'];
function pubOf(p){ const eng={}; ENGK.forEach(k=>{ if(p.data.profile[k]!==undefined) eng[k]=p.data.profile[k]; });
  return JSON.parse(JSON.stringify({name:p.name,color:p.color,races:p.data.races||[],eng,blocks:(p.data.blocks||[]).map(b=>({kind:b.kind,from:b.from,to:b.to,id:b.id||null}))})); }
function pubProfile(id,pb){ return {id,ro:true,name:pb.name||'Sportif',color:pb.color||'#888',data:mergeAth({profile:pb.eng||{},races:pb.races||[],blocks:pb.blocks||[]})}; }
function gMarkNew(p){ if(!p.key) p.key=rid(28); G.full[p.id]=p; delete G.deleted[p.id]; }
function gMarkDeleted(id){ const p=G.full[id]; if(p) G.deleted[id]=p.key; delete G.full[id]; }
function gAssemble(){
  const settings=(ROOT&&ROOT.settings)||{coachView:true,noSwipe:false}, prevA=ROOT&&ROOT.active, savedAt=ROOT&&ROOT.savedAt||null;
  const profs=Object.values(G.full).filter(p=>!G.deleted[p.id]);
  if(!G.admin) for(const [id,pb] of Object.entries(G.pubs)) if(!G.full[id]) profs.push(pubProfile(id,pb));
  profs.sort((a,b)=>(a.ro?1:0)-(b.ro?1:0)||String(a.name).localeCompare(String(b.name),'fr'));
  ROOT={profiles:profs,active:G.admin?(prevA||lsGet('coach-admin-active')):G.me,savedAt,lastBackup:null,settings};
  const a=ath(ROOT.active); if(!a||a.ro) ROOT.active=(profs.find(p=>!p.ro)||{}).id; }
function gCache(){ try{ lsSet(gCacheKey(),JSON.stringify({full:Object.values(G.full).map(p=>({id:p.id,key:p.key,name:p.name,color:p.color,data:p.data})),pubs:G.pubs,me:G.me,known:G.known,club:G.club,meta:G.meta,settings:ROOT&&ROOT.settings,active:ROOT&&ROOT.active,savedAt:ROOT&&ROOT.savedAt})); if(G.admin&&ROOT) lsSet('coach-admin-active',ROOT.active); }catch(e){} }
function gFromCache(c){ if(!c) return; (c.full||[]).forEach(p=>{ G.full[p.id]={id:p.id,key:p.key,name:p.name,color:p.color,data:mergeAth(p.data)}; });
  G.pubs=c.pubs||{}; G.me=c.me||null; G.known=c.known||{}; G.club=c.club||{}; G.meta=c.meta||{};
  ROOT={settings:c.settings||{coachView:true,noSwipe:false},active:c.active,savedAt:c.savedAt||null,profiles:[]}; gAssemble(); }
function gReady(){ if(!editables().length){ GATE=G.admin?'empty':'loading'; return false; } if(GATE==='loading'||GATE==='empty') GATE=false; const ch=freezeAll(); refresh(); lastCore=core(); if(ch) save(); return true; }
function gRender(){ const ae=document.activeElement; if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&!GATE&&ae.type!=='file'){ G.needRender=true; return; } G.needRender=false; render(); }
document.addEventListener('focusout',()=>{ if(G.needRender) setTimeout(()=>{ if(G.needRender) gRender(); },50); });
function gApplyFull(id,key,d){ if(G.deleted[id]) return false; const js=typeof d.data==='string'?d.data:'{}'; let f=G.full[id], ch=false;
  if(!f){ f=G.full[id]={id,key,name:d.name||'Sportif',color:d.color||COLORS[0],data:mergeAth(JSON.parse(js))}; ch=true; }
  else { if(!G.rekey[id]) f.key=key; if(js!==G.last[id]){ f.data=mergeAth(JSON.parse(js)); ch=true; }
    if(G.admin&&(d.name&&d.name!==f.name||d.color&&d.color!==f.color)){ f.name=d.name; f.color=d.color; ch=true; } else if(!G.admin&&d.name&&(d.name!==f.name||d.color!==f.color)){ f.name=d.name; f.color=d.color; ch=true; } }
  G.last[id]=js; G.lastMeta[id]=f.name+'|'+f.color; if(d.updatedAt) G.meta[id]=d.updatedAt; return ch; }

let gPushT=null, gInflight=0;
function gPush(){ if(!G.db) return; clearTimeout(gPushT); gPushT=setTimeout(gPushNow,100); }
function gPushNow(){ const F=G.F, db=G.db; if(!F||!db||GATE) return; const now=new Date().toISOString(); const ops=[];
  for(const p of editables()){
    if(!p.key){ if(!G.admin) continue; gMarkNew(p); }
    if(G.admin) G.full[p.id]=p;
    const js=JSON.stringify(p.data), meta=p.name+'|'+p.color, pb=JSON.stringify(pubOf(p));
    if(typeof G.rekey[p.id]==='string'){ const old=G.rekey[p.id], id=p.id; G.rekey[id]={old};
      ops.push(F.setDoc(F.doc(db,'ath',p.key),{pub:p.id,name:p.name,color:p.color,data:js,updatedAt:now}).then(()=>F.deleteDoc(F.doc(db,'ath',old))).then(()=>{ delete G.rekey[id]; })); G.last[p.id]=js; G.lastMeta[p.id]=meta; G.meta[p.id]=now; }
    else if(G.last[p.id]!==js||(G.admin&&G.lastMeta[p.id]!==meta)){ G.last[p.id]=js; G.lastMeta[p.id]=meta; G.meta[p.id]=now;
      ops.push(G.admin?F.setDoc(F.doc(db,'ath',p.key),{pub:p.id,name:p.name,color:p.color,data:js,updatedAt:now}):F.updateDoc(F.doc(db,'ath',p.key),{data:js,updatedAt:now})); }
    if(G.lastPub[p.id]!==pb){ G.lastPub[p.id]=pb; const o=JSON.parse(pb); o.updatedAt=now;
      ops.push(G.admin?F.setDoc(F.doc(db,'pub',p.id),o):F.updateDoc(F.doc(db,'pub',p.id),{races:o.races,eng:o.eng,blocks:o.blocks,updatedAt:now})); }
    if(G.admin) G.known[p.id]=G.known[p.id]||p.key; }
  if(G.admin) for(const [id,key] of Object.entries(G.deleted)){ if(key) ops.push(F.deleteDoc(F.doc(db,'ath',key)),F.deleteDoc(F.doc(db,'pub',id))); delete G.known[id]; G.deleted[id]=null; }
  if(!ops.length) return; gCache(); gInflight++; G.state='pending'; setSync();
  Promise.all(ops).then(()=>{ gInflight--; if(!gInflight){ G.state='ok'; setSync(); } }).catch(err=>{ gInflight--; console.error(err); G.state='off'; setSync(); if(err&&err.code==='permission-denied') toast('Enregistrement refusé par le serveur'); }); }

/* ---- connexion Firebase ---- */
async function fbLoad(){ if(window.__FBMOCK) return window.__FBMOCK; const B='https://www.gstatic.com/firebasejs/'+FBV+'/';
  const [a,au,fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]); return Object.assign({},a,au,fs); }
async function gConnect(){
  const F=G.F=await fbLoad(); const app=F.initializeApp(FB.cfg);
  try{ G.db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})}); }catch(e){ G.db=F.getFirestore(app); }
  G.auth=F.getAuth(app);
  const user=await new Promise(res=>{ const u=F.onAuthStateChanged(G.auth,x=>{ u(); res(x); }); });
  if(G.admin){ if(!user||user.isAnonymous||user.uid!==FB.admin){ GATE='login'; G.state='off'; render(); return; } G.email=user.email||''; return gListenAdmin(); }
  if(!user) await F.signInAnonymously(G.auth);
  return gListenUser(); }
async function gLogin(){ const em=(($('#gmail')||{}).value||'').trim(), pw=($('#gpass')||{}).value||''; if(!em||!pw){ toast('E-mail et mot de passe'); return; } G.email=em;
  try{ if(!G.F) await gConnect(); const c=await G.F.signInWithEmailAndPassword(G.auth,em,pw);
    if(c.user.uid!==FB.admin){ await G.F.signOut(G.auth); toast('Ce compte n\'est pas administrateur'); return; }
    GATE='loading'; render(); gListenAdmin(); }
  catch(e){ console.error(e); toast(/network/.test(e&&e.code||'')?'Pas de connexion internet':'E-mail ou mot de passe incorrect'); } }
function gListenAdmin(){ const F=G.F, db=G.db; G.state='wait'; setSync();
  F.onSnapshot(F.doc(db,'club','meta'),s=>{ G.club=s.exists()?s.data():{}; },()=>{});
  F.onSnapshot(F.collection(db,'ath'),qs=>{ let ch=false; const seen=new Set();
    qs.forEach(d=>{ const x=d.data(); if(!x||!x.pub) return; seen.add(x.pub); if(G.rekey[x.pub]&&d.id!==G.full[x.pub]?.key) return; G.known[x.pub]=d.id; if(gApplyFull(x.pub,d.id,x)) ch=true; });
    if(!qs.metadata.fromCache&&!qs.metadata.hasPendingWrites) for(const id of Object.keys(G.full)) if(!seen.has(id)&&G.known[id]){ delete G.full[id]; delete G.known[id]; ch=true; }
    if(!qs.metadata.fromCache&&!gInflight) G.state='ok';
    if(ch||GATE){ gAssemble(); gReady(); gCache(); gRender(); } else setSync(); },
    err=>{ console.error(err); G.state='off'; if(err&&err.code==='permission-denied'){ GATE='login'; } render(); }); }
function gListenUser(){ const F=G.F, db=G.db; G.state='wait'; setSync();
  const uid=G.auth.currentUser.uid; let pubUnsub=null;
  const listenPubs=()=>{ if(pubUnsub) pubUnsub(); pubUnsub=F.onSnapshot(F.collection(db,'pub'),qs=>{ const P={}; qs.forEach(d=>P[d.id]=d.data()); G.pubs=P; gAssemble(); gReady(); gCache(); gRender(); },
    err=>{ if(!G.claimed) claimP.then(listenPubs,()=>{}); }); };
  const claimP=F.setDoc(F.doc(db,'claims',uid),{key:G.key,at:new Date().toISOString()}).then(()=>{ G.claimed=true; });
  claimP.catch(err=>{ console.error(err); if(err&&err.code==='permission-denied'){ GATE='revoked'; lsSet('coach-key',null); render(); } });
  F.onSnapshot(F.doc(db,'ath',G.key),snap=>{
    if(!snap.exists()){ if(!snap.metadata.fromCache){ GATE='revoked'; lsSet('coach-key',null); lsSet(gCacheKey(),null); render(); } return; }
    if(snap.metadata.hasPendingWrites) return;
    const d=snap.data(); G.me=d.pub; const ch=gApplyFull(d.pub,G.key,d);
    if(!snap.metadata.fromCache&&!gInflight) G.state='ok';
    if(ch||GATE){ gAssemble(); gReady(); gCache(); gRender(); } else setSync(); },
    err=>{ console.error(err); G.state='off'; setSync(); });
  listenPubs(); }
async function gStart(){
  const k=urlKey(); G.on=true;
  if(k){ if(lsGet('coach-key')!==k) lsSet('coach-group-user',null); lsSet('coach-key',k); G.key=k; }
  else if(lsGet('coach-admin')==='1') G.admin=true;
  else G.key=lsGet('coach-key');
  if(G.admin) MAXATH=20;
  try{ gFromCache(JSON.parse(lsGet(gCacheKey())||'null')); }catch(e){}
  if(!ROOT||!editables().length){ GATE='loading'; ROOT=ROOT||migrate({}); if(!ROOT.profiles.length) ROOT=migrate({}); }
  else gReady();
  G.state='wait'; render();
  window.addEventListener('pagehide',()=>flush()); document.addEventListener('visibilitychange',()=>{ if(document.hidden) flush(); });
  try{ await gConnect(); }catch(e){ console.error(e); G.state='off'; if(GATE==='loading') GATE='offline'; render(); } }

/* ---- hors ligne : service worker (version hébergée) ---- */
if(STANDALONE&&location.protocol==='https:'&&'serviceWorker' in navigator&&!window.__FBMOCK){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }

/* ---------- démarrage ---------- */
(async()=>{ if(GROUP_OK&&gWanted()){ gStart(); return; }
  loadLocal(); if(STANDALONE) SA.boot(); if(!ROOT){ setRoot({}); if(GROUP_OK&&!lsHad()) GATE=true; } render(); initSync(); if(STANDALONE) SA.afterBoot(); })();

</script>
